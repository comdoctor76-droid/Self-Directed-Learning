<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>2610 주요치료비통합보장 특약 보험금시뮬레이션</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* 단독 실행 페이지 — 시뮬레이터만 보여 주고, 다른 학습 자료로 가는 길은 두지 않는다 */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#fff;font-family:'Noto Sans KR',sans-serif}
body{display:flex;flex-direction:column;height:100dvh}
.top{display:flex;align-items:center;gap:8px;background:#1A2744;color:#fff;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
.top h1{flex:1;font-size:15.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;font-size:17px;font-weight:900;cursor:pointer;font-family:inherit}
.pr{display:none}
@media(min-width:768px){.pr{display:inline-block}}
iframe{flex:1;width:100%;border:0;background:#f8fafc}
.bye{flex:1;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#475569;font-weight:700;text-align:center;padding:24px}
.bye b{font-size:18px;color:#1A2744}
body.closed iframe{display:none}
body.closed .bye{display:flex}
body.closed .top .b{display:none}
</style>
</head>
<body>
<div class="top">
  <h1>2610 주요치료비통합보장</h1>
  <button class="b pr" id="pr" type="button" title="인쇄 (가로)" aria-label="인쇄">🖨</button>
  <button class="b" id="cl" type="button" title="닫기" aria-label="닫기">✕</button>
</div>
<iframe id="fr" src="assets/sim/2610-integrated.html" title="시뮬레이터" allow="web-share; clipboard-write"></iframe>
<div class="bye"><b>시뮬레이터를 닫았습니다.</b>이 창(탭)을 닫아 주세요.</div>
<script>
document.getElementById('pr').onclick=function(){
  var w=document.getElementById('fr').contentWindow;
  if(w&&w.printReport)w.printReport();
};
document.getElementById('cl').onclick=function(){
  window.close();   /* 스크립트로 열린 창이면 바로 닫힌다 */
  setTimeout(function(){   /* 닫히지 않는 경우(링크로 직접 연 탭): 화면을 비우고 안내 */
    if(window.closed)return;
    document.getElementById('fr').src='about:blank';
    document.body.classList.add('closed');
  },150);
};
</script>
</body>
</html>
