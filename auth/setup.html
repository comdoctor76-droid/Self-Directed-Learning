<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>관리자 최초 설정 · 스스로 학습하기</title>
<link rel="stylesheet" href="auth.css">
<script src="auth-config.js"></script>
<script>(function(m){var v={firebase:['vendor/firebase-app-compat.js','vendor/firebase-auth-compat.js','vendor/firebase-firestore-compat.js','vendor/firebase-functions-compat.js']}[m]||[];v.forEach(function(s){document.write('<script src="'+s+'"><\/script>');});})((window.AUTH_CONFIG||{}).mode);</script>
<script src="auth-core.js"></script>
</head><body>
<div class="auth-bg"><div class="auth-card">
  <span class="brand">최초 1회</span><h1>관리자 계정 만들기</h1>
  <p class="sub">운영(Firebase) 모드에서 관리자 사번 <b id="aid"></b> 계정을 처음 한 번 만듭니다. 이미 있으면 만들어지지 않습니다.</p>
  <div class="msg" id="m"></div>
  <label class="fld"><span>관리자 비밀번호</span><input id="p1" type="password" autocomplete="new-password"></label>
  <label class="fld"><span>비밀번호 확인</span><input id="p2" type="password" autocomplete="new-password"></label>
  <button class="btn" id="go">관리자 계정 만들기</button>
</div></div>
<script>
var A=window.AUTH,$=function(i){return document.getElementById(i);};$('aid').textContent=A.config.adminId;
function msg(t,k){var m=$('m');m.className='msg show '+(k||'err');m.textContent=t;}
if(A.config.mode!=='firebase'){msg('운영(Firebase) 모드에서만 쓰는 화면입니다. 체험 모드의 관리자 첫 비밀번호는 사번입니다.','info');$('go').disabled=true;}
$('go').onclick=function(){var p=$('p1').value;if(p.length<8){msg('8자 이상 입력해 주세요.');return;}if(p!==$('p2').value){msg('두 비밀번호가 다릅니다.');return;}
  A.backend().setupAdmin(p).then(function(){msg('관리자 계정을 만들었습니다. 로그인 화면에서 로그인해 주세요.','ok');$('go').disabled=true;}).catch(function(e){msg(e.userMsg||e.message);});};
</script>
</body></html>
