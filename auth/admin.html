<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>관리자 · 스스로 학습하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
<script src="auth-config.js"></script>
<script>if((window.AUTH_CONFIG||{}).mode==='supabase')document.write('<script src="vendor/supabase.js"><\/script>');</script>
<script src="auth-core.js"></script>
<script src="vendor/chart.umd.js"></script>
<style>
.top{background:linear-gradient(135deg,#1A2744,#2C3F6E 60%,#3d5390);color:#fff;padding:22px 18px 0}
.top-in{max-width:1180px;margin:0 auto}
.top h1{font-size:22px;font-weight:900}
.top .who{font-size:13px;opacity:.85;margin-top:2px}
.tabs{display:flex;gap:4px;margin-top:16px;overflow-x:auto}
.tabs button{font:inherit;font-size:15px;font-weight:800;border:none;background:rgba(255,255,255,.12);color:#fff;padding:11px 18px;border-radius:12px 12px 0 0;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--bg);color:var(--navy)}
.wrap{max-width:1180px;margin:0 auto;padding:18px}
.panel{display:none}.panel.on{display:block}
.box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.box h2{font-size:17px;font-weight:900;margin-bottom:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.bar input,.bar select{font:inherit;font-size:14px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{background:var(--org);color:#fff;text-align:left;padding:9px 8px;white-space:nowrap;position:sticky;top:0}
.tbl td{border-bottom:1px solid #F3EEE8;padding:8px;vertical-align:top}
.tbl tr:hover td{background:#FFFAF5}
.scroll{overflow:auto;max-height:62vh;border-radius:10px;border:1px solid var(--line)}
.tag{display:inline-block;font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 8px;white-space:nowrap}
.t-admin{background:#EBEFF8;color:#2C3F6E}.t-need{background:#FCEBEA;color:var(--red)}.t-ok{background:#E7F5EE;color:var(--green)}.t-k{background:#FFF7CC;color:#7A6200}
.act button{font:inherit;font-size:12px;font-weight:800;border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 8px;cursor:pointer;margin:0 2px 2px 0}
.act button.d{color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
@media(max-width:700px){.kpi{grid-template-columns:repeat(2,1fr)}}
.kpi div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi b{display:block;font-size:24px;font-weight:900;color:var(--org2)}
.kpi span{font-size:12.5px;color:var(--dim);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(20,25,38,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:100}
.modal.on{display:flex}
.modal .auth-card{max-width:520px;max-height:92vh;overflow:auto}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.small{font-size:12.5px;color:var(--dim)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:14px;font-weight:700;padding:10px 18px;border-radius:999px;display:none;z-index:200}
textarea.bulk{width:100%;min-height:150px;font:inherit;font-size:13.5px;padding:10px;border:1.5px solid var(--line);border-radius:10px}
.chartbox{position:relative;height:300px}
</style>
</head><body>
<div class="top"><div class="top-in">
  <h1>🔐 관리자 · 스스로 학습하기</h1><div class="who" id="who"></div>
  <div class="tabs"><button class="on" data-t="m">👥 회원 관리</button><button data-t="a">🕒 접속·학습 기록</button><button data-t="s">📊 통계</button></div>
</div></div>
<div class="wrap">
  <!-- 회원 관리 -->
  <div class="panel on" id="P-m">
    <div class="box"><h2>회원 목록 <span class="small" id="mcount"></span></h2>
      <div class="bar"><input id="mq" placeholder="사번·성명·소속 검색" style="flex:1;min-width:180px">
        <select id="mf-co"><option value="">소속사 전체</option></select><select id="mf-rg"><option value="">지역단 전체</option></select>
        <button class="btn sm" id="madd">+ 사번 추가</button><button class="btn sm sec" id="mbulk">일괄 등록</button><button class="btn sm sec" id="mcsv">CSV 내려받기</button></div>
      <div class="scroll"><table class="tbl" id="mtbl"></table></div>
      <p class="small" style="margin-top:8px">새 사번의 처음 비밀번호는 사번입니다. 첫 로그인 때 본인이 바꿉니다. '초기화'를 누르면 비밀번호가 사번으로 돌아갑니다.</p>
    </div>
  </div>
  <!-- 기록 -->
  <div class="panel" id="P-a">
    <div class="box"><h2>접속·학습 기록 <span class="small" id="acount"></span></h2>
      <div class="bar">기간 <input type="date" id="af"> ~ <input type="date" id="at"><input id="ae" placeholder="사번" maxlength="6" style="width:100px">
        <select id="ap"><option value="">페이지 전체</option></select><select id="ak"><option value="">종류 전체</option><option value="login">로그인</option><option value="page">페이지 진입</option><option value="section">섹션 보기</option><option value="card">카드 열기</option><option value="image">그림 확대</option></select>
        <button class="btn sm" id="ago">조회</button><button class="btn sm sec" id="acsv">CSV 내려받기</button></div>
      <div class="scroll"><table class="tbl" id="atbl"></table></div>
    </div>
  </div>
  <!-- 통계 -->
  <div class="panel" id="P-s">
    <div class="bar">기간 <input type="date" id="sf"> ~ <input type="date" id="st"><button class="btn sm" id="sgo">다시 계산</button></div>
    <div class="kpi"><div><b id="k1">0</b><span>접속자 수</span></div><div><b id="k2">0</b><span>로그인 횟수</span></div><div><b id="k3">0</b><span>카드 열람</span></div><div><b id="k4">0</b><span>그림 확대</span></div></div>
    <div class="box"><h2>🏆 가장 많이 학습한 카드 TOP 15</h2><div class="chartbox" style="height:420px"><canvas id="c1"></canvas></div></div>
    <div class="grid2">
      <div class="box"><h2>📄 페이지별 방문</h2><div class="chartbox"><canvas id="c2"></canvas></div></div>
      <div class="box"><h2>📅 일자별 접속자</h2><div class="chartbox"><canvas id="c3"></canvas></div></div>
      <div class="box"><h2>🏢 소속사별 학습량</h2><div class="chartbox"><canvas id="c4"></canvas></div></div>
      <div class="box"><h2>🗺️ 지역단별 학습량</h2><div class="chartbox"><canvas id="c5"></canvas></div></div>
    </div>
  </div>
</div>
<div class="modal" id="MM"><div class="auth-card" id="MMC"></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
'use strict';
var A=window.AUTH, s=A.session();
if(!s){location.replace('login.html?next='+encodeURIComponent(location.href));return;}
if(s.role!=='admin'){document.body.innerHTML='<div class="auth-bg"><div class="auth-card"><h1>관리자만 볼 수 있습니다</h1><p class="sub">'+s.emp+' 계정은 관리자 권한이 없습니다.</p><a class="btn" href="../index.html">메인으로</a></div></div>';return;}
if(s.mustChange||!s.consent){location.replace('login.html?next='+encodeURIComponent(location.href));return;}
var B=A.backend();
var PAGES={'index.html':'메인','sales-guide.html':'특약나열식 제안의 문제점','receipt-guide.html':'상담 1일차 · 의료비 영수증','priority-guide.html':'상담 2일차 · 중증질환과 보험','bias-guide.html':'고객이 범하는 인지적 오류','lung-cancer-guide.html':'폐암 가이드','breast-cancer-guide.html':'유방암 가이드','cancer-guide.html':'항암치료 가이드','corporate-guide.html':'법인컨설팅 가이드','test.html':'(체험) 시험 페이지','login':'로그인'};
var KINDS={login:'로그인',page:'페이지 진입',section:'섹션 보기',card:'카드 열기',image:'그림 확대'};
var FIELDS=[['emp_id','사번'],['name','성명'],['phone','전화번호'],['company','소속사'],['region','지역단'],['vision_center','비전센터'],['branch','지점'],['note','비고']];
document.getElementById('who').textContent=(s.name||s.emp)+' ('+s.emp+') · '+(A.config.mode==='supabase'?'운영 모드':'체험 모드 — 이 브라우저에만 저장');
function h(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none';},2200);}
function fail(e){toast('⚠ '+(e.userMsg||e.message||'오류'));}
function kst(iso){var d=new Date(iso);if(isNaN(d))return iso;var p=function(n){return('0'+n).slice(-2);};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}
function csv(rows,name){var t='﻿'+rows.map(function(r){return r.map(function(c){c=String(c==null?'':c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',');}).join('\n');
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},2000);}
/* 탭 */
Array.prototype.forEach.call(document.querySelectorAll('.tabs button'),function(b){b.onclick=function(){
  document.querySelectorAll('.tabs button').forEach(function(x){x.classList.toggle('on',x===b);});
  document.querySelectorAll('.panel').forEach(function(p){p.classList.toggle('on',p.id==='P-'+b.dataset.t);});
  if(b.dataset.t==='a')loadAct(); if(b.dataset.t==='s')loadStats();};});

/* ── 회원 ── */
var members=[];
function loadMembers(){return B.listMembers().then(function(l){members=l.sort(function(a,b){return a.emp_id<b.emp_id?-1:1;});fillFilters();drawMembers();}).catch(fail);}
function fillFilters(){[['mf-co','company'],['mf-rg','region']].forEach(function(p){var sel=document.getElementById(p[0]),v=sel.value,set={};members.forEach(function(m){if(m[p[1]])set[m[p[1]]]=1;});
  sel.innerHTML='<option value="">'+(p[1]==='company'?'소속사':'지역단')+' 전체</option>'+Object.keys(set).sort().map(function(x){return'<option>'+h(x)+'</option>';}).join('');sel.value=v;});}
function drawMembers(){
  var q=document.getElementById('mq').value.trim().toLowerCase(),co=document.getElementById('mf-co').value,rg=document.getElementById('mf-rg').value;
  var l=members.filter(function(m){if(co&&m.company!==co)return false;if(rg&&m.region!==rg)return false;if(!q)return true;return FIELDS.some(function(f){return String(m[f[0]]||'').toLowerCase().indexOf(q)>=0;});});
  document.getElementById('mcount').textContent='· '+l.length+'명 / 전체 '+members.length+'명';
  var t='<tr>'+FIELDS.map(function(f){return'<th>'+f[1]+'</th>';}).join('')+'<th>상태</th><th>관리</th></tr>';
  l.forEach(function(m){t+='<tr>'+FIELDS.map(function(f){return'<td>'+h(m[f[0]])+'</td>';}).join('')+'<td>'+
    (m.role==='admin'?'<span class="tag t-admin">관리자</span> ':'')+(m.must_change_pw?'<span class="tag t-need">비번 변경 전</span> ':'<span class="tag t-ok">사용 중</span> ')+(m.kakao_linked?'<span class="tag t-k">카카오</span>':'')+
    '</td><td class="act"><button data-e="'+m.emp_id+'">수정</button><button data-r="'+m.emp_id+'">초기화</button>'+(m.kakao_linked?'<button data-k="'+m.emp_id+'">카카오 해제</button>':'')+(m.role!=='admin'?'<button class="d" data-d="'+m.emp_id+'">삭제</button>':'')+'</td></tr>';});
  var tb=document.getElementById('mtbl');tb.innerHTML=t;
  tb.querySelectorAll('[data-e]').forEach(function(b){b.onclick=function(){editMember(members.filter(function(m){return m.emp_id===b.dataset.e;})[0]);};});
  tb.querySelectorAll('[data-r]').forEach(function(b){b.onclick=function(){if(!confirm(b.dataset.r+' 의 비밀번호를 사번으로 초기화할까요?'))return;B.resetPassword(b.dataset.r).then(function(){toast('초기화했습니다. 다음 로그인 때 비밀번호를 바꾸게 됩니다.');return loadMembers();}).catch(fail);};});
  tb.querySelectorAll('[data-k]').forEach(function(b){b.onclick=function(){if(!confirm(b.dataset.k+' 의 카카오 연결을 해제할까요?'))return;B.unlinkKakao(b.dataset.k).then(function(){toast('카카오 연결을 해제했습니다.');return loadMembers();}).catch(fail);};});
  tb.querySelectorAll('[data-d]').forEach(function(b){b.onclick=function(){if(!confirm(b.dataset.d+' 계정을 삭제할까요? 되돌릴 수 없습니다.'))return;B.deleteMember(b.dataset.d).then(function(){toast('삭제했습니다.');return loadMembers();}).catch(fail);};});
}
['mq','mf-co','mf-rg'].forEach(function(id){document.getElementById(id).oninput=drawMembers;});
var MM=document.getElementById('MM'),MMC=document.getElementById('MMC');
MM.onclick=function(e){if(e.target===MM)MM.classList.remove('on');};
function editMember(m){var isNew=!m;m=m||{};
  MMC.innerHTML='<h1 style="font-size:20px">'+(isNew?'사번 추가':'회원 정보 수정')+'</h1><p class="sub">'+(isNew?'처음 비밀번호는 사번으로 만들어집니다.':'사번 '+h(m.emp_id))+'</p><div class="msg"></div><div class="f2">'+
  FIELDS.map(function(f){return'<label class="fld"'+(f[0]==='note'?' style="grid-column:1/-1"':'')+'><span>'+f[1]+(f[0]==='emp_id'?' (영문·숫자 6자리)':'')+'</span><input data-f="'+f[0]+'" value="'+h(m[f[0]])+'"'+(f[0]==='emp_id'&&!isNew?' disabled':'')+(f[0]==='emp_id'?' maxlength="6"':'')+'></label>';}).join('')+
  '</div><div class="row"><button class="btn" id="sv">저장</button><button class="btn sec" id="cx">취소</button></div>';
  MM.classList.add('on');
  MMC.querySelector('#cx').onclick=function(){MM.classList.remove('on');};
  MMC.querySelector('#sv').onclick=function(){var o={};MMC.querySelectorAll('[data-f]').forEach(function(i){o[i.dataset.f]=i.value.trim();});if(!isNew)o.emp_id=m.emp_id;
    if(!A.validId(o.emp_id)){var e=MMC.querySelector('.msg');e.className='msg show err';e.textContent='사번은 영문·숫자 6자리입니다.';return;}
    if(isNew&&members.some(function(x){return x.emp_id===A.normId(o.emp_id);})){var e2=MMC.querySelector('.msg');e2.className='msg show err';e2.textContent='이미 등록된 사번입니다.';return;}
    B.upsertMember(o).then(function(){MM.classList.remove('on');toast('저장했습니다.');return loadMembers();}).catch(function(e){var x=MMC.querySelector('.msg');x.className='msg show err';x.textContent=e.userMsg||e.message;});};
}
document.getElementById('madd').onclick=function(){editMember(null);};
document.getElementById('mbulk').onclick=function(){
  MMC.innerHTML='<h1 style="font-size:20px">일괄 등록</h1><p class="sub">엑셀에서 복사해 붙여넣거나 쉼표로 구분해 한 줄에 한 명씩 입력하세요.<br>순서: 사번, 성명, 전화번호, 소속사, 지역단, 비전센터, 지점, 비고</p><div class="msg"></div>'+
  '<textarea class="bulk" id="bt" placeholder="AB1234	홍길동	010-0000-0000	현대해상	서울지역단	강남비전센터	역삼지점	"></textarea><div class="row" style="margin-top:12px"><button class="btn" id="bg">등록</button><button class="btn sec" id="bc">취소</button></div>';
  MM.classList.add('on');MMC.querySelector('#bc').onclick=function(){MM.classList.remove('on');};
  MMC.querySelector('#bg').onclick=async function(){var lines=MMC.querySelector('#bt').value.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean),ok=0,bad=[];
    for(var i=0;i<lines.length;i++){var c=lines[i].split(lines[i].indexOf('\t')>=0?'\t':',').map(function(x){return x.trim();});if(/^사번$/.test(c[0]))continue;
      var o={};FIELDS.forEach(function(f,j){o[f[0]]=c[j]||'';});
      if(!A.validId(o.emp_id)){bad.push((i+1)+'줄: 사번 형식 오류('+o.emp_id+')');continue;}
      try{await B.upsertMember(o);ok++;}catch(e){bad.push((i+1)+'줄: '+(e.userMsg||e.message));}}
    var m=MMC.querySelector('.msg');m.className='msg show '+(bad.length?'err':'ok');m.innerHTML=ok+'명 등록·갱신'+(bad.length?'<br>'+bad.map(h).join('<br>'):'');loadMembers();};
};
document.getElementById('mcsv').onclick=function(){csv([FIELDS.map(function(f){return f[1];}).concat(['권한','비번변경','카카오','등록일'])].concat(members.map(function(m){return FIELDS.map(function(f){return m[f[0]];}).concat([m.role,m.must_change_pw?'변경 전':'완료',m.kakao_linked?'연결':'',kst(m.created_at)]);})),'회원목록.csv');};

/* ── 기록 ── */
var acts=[];
function range(fid,tid){var f=document.getElementById(fid).value,t=document.getElementById(tid).value;return{from:f?new Date(f+'T00:00:00').toISOString():'',to:t?new Date(t+'T23:59:59').toISOString():''};}
function mname(id){var m=members.filter(function(x){return x.emp_id===id;})[0];return m?m.name:'';}
function loadAct(){var r=range('af','at');r.emp=document.getElementById('ae').value.trim();r.page=document.getElementById('ap').value;var k=document.getElementById('ak').value;
  return B.listActivity(r).then(function(l){acts=k?l.filter(function(a){return a.kind===k;}):l;var t='<tr><th>일시</th><th>사번</th><th>성명</th><th>페이지</th><th>종류</th><th>내용</th></tr>';
    acts.slice(0,3000).forEach(function(a){t+='<tr><td style="white-space:nowrap">'+kst(a.at)+'</td><td>'+h(a.emp_id)+'</td><td>'+h(mname(a.emp_id))+'</td><td>'+h(PAGES[a.page]||a.page)+'</td><td>'+h(KINDS[a.kind]||a.kind)+'</td><td>'+h(a.title||a.target)+'</td></tr>';});
    document.getElementById('atbl').innerHTML=t;document.getElementById('acount').textContent='· '+acts.length+'건'+(acts.length>3000?' (최근 3,000건 표시)':'');}).catch(fail);}
document.getElementById('ap').innerHTML='<option value="">페이지 전체</option>'+Object.keys(PAGES).map(function(p){return'<option value="'+p+'">'+PAGES[p]+'</option>';}).join('');
document.getElementById('ago').onclick=loadAct;
document.getElementById('acsv').onclick=function(){csv([['일시','사번','성명','페이지','종류','내용']].concat(acts.map(function(a){return[kst(a.at),a.emp_id,mname(a.emp_id),PAGES[a.page]||a.page,KINDS[a.kind]||a.kind,a.title||a.target];})),'학습기록.csv');};

/* ── 통계 ── */
var charts={};
function chart(id,type,labels,data,opt){if(charts[id])charts[id].destroy();if(!window.Chart)return;
  charts[id]=new Chart(document.getElementById(id),{type:type,data:{labels:labels,datasets:[{data:data,backgroundColor:type==='line'?'rgba(232,101,26,.15)':'#E8651A',borderColor:'#E8651A',borderWidth:type==='line'?2.5:0,fill:type==='line',tension:.25,borderRadius:6,maxBarThickness:30}]},
  options:Object.assign({responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{autoSkip:true,maxRotation:0},grid:{display:false}},y:{beginAtZero:true,ticks:{precision:0}}}},opt||{})});}
function topN(map,n){return Object.keys(map).map(function(k){return[k,map[k]];}).sort(function(a,b){return b[1]-a[1];}).slice(0,n);}
function loadStats(){var r=range('sf','st');return B.listActivity(r).then(function(l){
  var users={},logins=0,cards=0,imgs=0,card={},page={},day={},co={},rg={};
  l.forEach(function(a){users[a.emp_id]=1;if(a.kind==='login')logins++;if(a.kind==='card')cards++;if(a.kind==='image')imgs++;
    if((a.kind==='card'||a.kind==='image')&&a.title){var k=a.title+'  ·  '+(PAGES[a.page]||a.page);card[k]=(card[k]||0)+1;}
    if(a.kind==='page'){page[PAGES[a.page]||a.page]=(page[PAGES[a.page]||a.page]||0)+1;}
    var d=kst(a.at).slice(0,10);(day[d]=day[d]||{})[a.emp_id]=1;
    if(a.kind!=='login'){var m=members.filter(function(x){return x.emp_id===a.emp_id;})[0]||{};var c=m.company||'(미입력)',g=m.region||'(미입력)';co[c]=(co[c]||0)+1;rg[g]=(rg[g]||0)+1;}});
  document.getElementById('k1').textContent=Object.keys(users).length;document.getElementById('k2').textContent=logins;document.getElementById('k3').textContent=cards;document.getElementById('k4').textContent=imgs;
  var t=topN(card,15);chart('c1','bar',t.map(function(x){return x[0].length>38?x[0].slice(0,38)+'…':x[0];}),t.map(function(x){return x[1];}),{indexAxis:'y',scales:{x:{beginAtZero:true,ticks:{precision:0}},y:{grid:{display:false}}}});
  var p=topN(page,12);chart('c2','bar',p.map(function(x){return x[0];}),p.map(function(x){return x[1];}),{indexAxis:'y',scales:{x:{beginAtZero:true,ticks:{precision:0}},y:{grid:{display:false}}}});
  var ds=Object.keys(day).sort();chart('c3','line',ds.map(function(d){return d.slice(5);}),ds.map(function(d){return Object.keys(day[d]).length;}));
  var c=topN(co,10);chart('c4','bar',c.map(function(x){return x[0];}),c.map(function(x){return x[1];}));
  var g=topN(rg,10);chart('c5','bar',g.map(function(x){return x[0];}),g.map(function(x){return x[1];}));
}).catch(fail);}
document.getElementById('sgo').onclick=loadStats;
loadMembers();
})();
</script>
</body></html>
