<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 정보 · 스스로 학습하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
<script src="auth-config.js"></script>
<script>(function(m){var v={supabase:['vendor/supabase.js'],firebase:['vendor/firebase-app-compat.js','vendor/firebase-auth-compat.js','vendor/firebase-firestore-compat.js','vendor/firebase-functions-compat.js']}[m]||[];v.forEach(function(s){document.write('<script src="'+s+'"><\/script>');});})((window.AUTH_CONFIG||{}).mode);</script>
<script src="auth-core.js"></script>
</head><body>
<div class="auth-bg"><div class="auth-card" id="card">
  <span class="brand">내 정보</span><h1 id="t">내 정보 수정</h1><p class="sub" id="sub"></p><div class="msg" id="m1"></div>
  <label class="fld"><span>성명</span><input id="nm" disabled></label>
  <label class="fld"><span>연락처</span><input id="ph" inputmode="tel"></label>
  <label class="fld"><span>소속사 *</span><input id="co"></label><label class="fld"><span>지역단 *</span><input id="rg"></label>
  <label class="fld"><span>비전센터 *</span><input id="vc"></label><label class="fld"><span>지점 *</span><input id="br"></label>
  <button class="btn" id="sv">저장</button>
  <h1 style="font-size:18px;margin-top:26px">비밀번호 변경</h1><div class="msg" id="m2"></div>
  <label class="fld"><span>현재 비밀번호</span><input id="p0" type="password" autocomplete="current-password"></label>
  <label class="fld"><span>새 비밀번호</span><input id="p1" type="password" autocomplete="new-password"></label>
  <label class="fld"><span>새 비밀번호 확인</span><input id="p2" type="password" autocomplete="new-password"></label>
  <button class="btn sec" id="pw">비밀번호 바꾸기</button>
  <div class="links"><a id="back" href="../index.html">← 돌아가기</a><span class="small" style="color:#6B7078;font-size:12.5px">성명·사번 수정은 관리자에게 요청</span></div>
</div></div>
<script>
(function(){
var A=window.AUTH,s=A.session(),q=new URLSearchParams(location.search);
if(!s){location.replace('login.html?next='+encodeURIComponent(location.href));return;}
var back=q.get('back');try{if(back&&new URL(back,location.href).origin===location.origin)document.getElementById('back').href=back;}catch(e){}
document.getElementById('sub').textContent='사번 '+s.emp+' · 연락처와 소속 정보를 직접 고칠 수 있습니다.';
var $=function(id){return document.getElementById(id);};
function msg(id,t,k){var m=$(id);m.className='msg show '+(k||'err');m.textContent=t;}
A.me().then(function(m){if(!m)return;$('nm').value=m.name||'';$('ph').value=m.phone||'';$('co').value=m.company||'';$('rg').value=m.region||'';$('vc').value=m.vision_center||'';$('br').value=m.branch||'';});
$('sv').onclick=function(){var o={phone:$('ph').value,company:$('co').value,region:$('rg').value,vision_center:$('vc').value,branch:$('br').value};
  A.updateProfile(o).then(function(){msg('m1','저장했습니다.','ok');}).catch(function(e){msg('m1',e.userMsg||'저장하지 못했습니다.');});};
$('pw').onclick=function(){var p1=$('p1').value,e=A.pwRule(p1);if(e){msg('m2',e);return;}if(p1!==$('p2').value){msg('m2','두 비밀번호가 다릅니다.');return;}if(A.normId(p1)===s.emp){msg('m2','사번과 같은 비밀번호는 쓸 수 없습니다.');return;}
  A.changePassword(p1,$('p0').value).then(function(){msg('m2','비밀번호를 바꿨습니다.','ok');$('p0').value=$('p1').value=$('p2').value='';}).catch(function(e){msg('m2',e.userMsg||'바꾸지 못했습니다.');});};
})();
</script>
</body></html>
