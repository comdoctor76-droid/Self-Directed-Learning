<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인 · 스스로 학습하기</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
<script src="auth-config.js"></script>
<script>(function(m){var v={firebase:['vendor/firebase-app-compat.js','vendor/firebase-auth-compat.js','vendor/firebase-firestore-compat.js','vendor/firebase-functions-compat.js']}[m]||[];v.forEach(function(s){document.write('<script src="'+s+'"><\/script>');});})((window.AUTH_CONFIG||{}).mode);</script>
<script src="auth-core.js"></script>
<script src="../version.js"></script>
</head><body>
<div class="auth-bg"><div class="auth-card" id="card"></div></div>
<script>
(function(){
'use strict';
var A=window.AUTH, C=A.config, qs=new URLSearchParams(location.search);
var NEXT=qs.get('next')||(function(){try{return sessionStorage.getItem('sdl_next');}catch(e){return null;}})()||'../index.html';
try{sessionStorage.setItem('sdl_next',NEXT);}catch(e){}
/* 다른 사이트로 튕겨 나가지 않게 같은 사이트 주소만 허용 */
try{var u=new URL(NEXT,location.href); if(u.origin!==location.origin) NEXT='../index.html';}catch(e){NEXT='../index.html';}
var card=document.getElementById('card');
if(C.mode!=='firebase'){var f=document.createElement('div');f.className='demo-flag';f.textContent='체험 모드 — 이 브라우저 안에만 저장됩니다';document.body.appendChild(f);}

function h(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function msg(t,kind){var m=card.querySelector('.msg');if(!m)return;m.className='msg show '+(kind||'err');m.textContent=t;}
function busy(b,on){if(!b)return;b.disabled=on;if(on){b.__t=b.textContent;b.textContent='처리 중…';}else if(b.__t)b.textContent=b.__t;}
function go(){try{sessionStorage.removeItem('sdl_next');}catch(e){} location.replace(NEXT);}
function nextStep(s){ if(!s){viewLogin();return;} if(s.mustChange){viewChange();return;} if(!s.consent){viewConsent();return;} if(!s.profile){viewProfile();return;} viewNotice(); }

function viewLogin(note){
  card.innerHTML='<span class="brand">스스로 학습하기</span><h1>사번으로 로그인</h1><p class="sub">사번(영문·숫자 6자리)과 비밀번호를 입력해 주세요.</p>'+
  '<div class="msg"></div>'+
  '<label class="fld"><span>사번</span><input id="id" autocomplete="username" inputmode="text" maxlength="6" autocapitalize="off" spellcheck="false" placeholder="예: AB1234"></label>'+
  '<label class="fld"><span>비밀번호</span><input id="pw" type="password" autocomplete="current-password" placeholder="처음이라면 사번을 입력"></label>'+
  '<p class="hint">처음 로그인할 때 비밀번호는 사번입니다. 로그인 후 바로 새 비밀번호로 바꿉니다.</p>'+
  '<button class="btn" id="go">로그인</button>'+
  '<div class="links"><button class="lnk" id="fg">비밀번호를 잊으셨나요?</button><span style="color:#6B7078;font-size:12.5px">로그인 유지 '+(C.sessionHours||24)+'시간</span></div>';
  if(note)msg(note.t,note.k);
  var id=card.querySelector('#id'),pw=card.querySelector('#pw'),b=card.querySelector('#go');
  function sub(){ if(!A.validId(id.value)){msg('사번은 영문·숫자 6자리입니다.');id.focus();return;} if(!pw.value){msg('비밀번호를 입력해 주세요.');pw.focus();return;}
    busy(b,true); A.login(id.value,pw.value).then(nextStep).catch(function(e){msg(e.userMsg||'로그인하지 못했습니다.');}).finally(function(){busy(b,false);}); }
  b.onclick=sub; pw.onkeydown=id.onkeydown=function(e){if(e.key==='Enter')sub();};
  card.querySelector('#fg').onclick=viewForgot; id.focus();
}
function viewChange(){
  card.innerHTML='<span class="brand">처음 로그인</span><h1>새 비밀번호 설정</h1><p class="sub">처음 비밀번호(사번)는 바로 바꿔야 학습 화면을 볼 수 있습니다.</p><div class="msg"></div>'+
  '<label class="fld"><span>새 비밀번호</span><input id="p1" type="password" autocomplete="new-password"></label>'+
  '<label class="fld"><span>새 비밀번호 확인</span><input id="p2" type="password" autocomplete="new-password"></label>'+
  '<p class="hint">8자 이상, 영문과 숫자를 함께 넣어 주세요. 사번과 같은 비밀번호는 쓸 수 없습니다.</p><button class="btn" id="go">비밀번호 바꾸기</button>';
  var b=card.querySelector('#go');
  b.onclick=function(){var p1=card.querySelector('#p1').value,p2=card.querySelector('#p2').value,s=A.session();
    var e=A.pwRule(p1); if(e){msg(e);return;} if(p1!==p2){msg('두 비밀번호가 다릅니다.');return;} if(s&&A.normId(p1)===s.emp){msg('사번과 같은 비밀번호는 쓸 수 없습니다.');return;}
    busy(b,true); A.changePassword(p1).then(function(){nextStep(A.session());}).catch(function(e){msg(e.userMsg||'바꾸지 못했습니다.');}).finally(function(){busy(b,false);});};
}
function viewConsent(){
  card.innerHTML='<span class="brand">개인정보 안내</span><h1>개인정보 수집·이용 동의</h1><p class="sub">학습 관리를 위해 아래 내용에 동의해 주세요.</p><div class="msg"></div>'+
  '<div class="consent"><b>수집 항목</b> 사번, 성명, 전화번호, 소속사, 지역단, 비전센터, 지점, 비고(관리자가 등록), 접속 일시, 학습한 페이지·카드 기록<br>'+
  '<b>이용 목적</b> 본인 확인, 비밀번호 찾기, 학습 현황 확인 및 교육 운영 통계<br><b>보관 기간</b> 계정 삭제 시까지(학습 기록은 최대 2년)<br>'+
  '<b>열람 권한</b> 시스템 관리자<br>동의하지 않으면 학습 화면을 이용할 수 없습니다.</div>'+
  '<label class="chk"><input type="checkbox" id="ck"> 위 내용을 확인했고 동의합니다.</label><button class="btn" id="go">동의하고 계속</button>';
  var b=card.querySelector('#go');
  b.onclick=function(){if(!card.querySelector('#ck').checked){msg('동의 항목에 체크해 주세요.');return;} busy(b,true); A.consent().then(function(){nextStep(A.session());}).catch(function(e){msg(e.userMsg||'저장하지 못했습니다.');}).finally(function(){busy(b,false);});};
}
function viewProfile(){
  card.innerHTML='<span class="brand">처음 로그인</span><h1>내 소속 정보 입력</h1><p class="sub">학습 관리를 위해 소속을 입력해 주세요. 나중에 \'내 정보\'에서 고칠 수 있습니다.</p><div class="msg"></div>'+
  '<label class="fld"><span>성명</span><input id="nm" disabled></label><label class="fld"><span>연락처</span><input id="ph" inputmode="tel" placeholder="010-0000-0000"></label>'+
  '<label class="fld"><span>소속사 *</span><input id="co"></label><label class="fld"><span>지역단 *</span><input id="rg"></label>'+
  '<label class="fld"><span>비전센터 *</span><input id="vc"></label><label class="fld"><span>지점 *</span><input id="br"></label><button class="btn" id="go">저장하고 시작하기</button>';
  A.me().then(function(m){if(!m)return;card.querySelector('#nm').value=m.name||'';card.querySelector('#ph').value=m.phone||'';
    card.querySelector('#co').value=m.company||'';card.querySelector('#rg').value=m.region||'';card.querySelector('#vc').value=m.vision_center||'';card.querySelector('#br').value=m.branch||'';});
  var b=card.querySelector('#go');
  b.onclick=function(){var v=function(id){return card.querySelector(id).value.trim();},o={phone:v('#ph'),company:v('#co'),region:v('#rg'),vision_center:v('#vc'),branch:v('#br')};
    var miss=[['company','소속사'],['region','지역단'],['vision_center','비전센터'],['branch','지점']].filter(function(x){return !o[x[0]];}).map(function(x){return x[1];});
    if(miss.length){msg(miss.join('·')+'을(를) 입력해 주세요.');return;}
    busy(b,true);A.updateProfile(o).then(function(){nextStep(A.session());}).catch(function(e){msg(e.userMsg||'저장하지 못했습니다.');}).finally(function(){busy(b,false);});};
}
/* 로그인 직후 안내 — 매 로그인마다 한 번 보여주고 확인하면 학습 화면으로 */
function viewNotice(){
  var V=window.SITE_VERSION||{};
  card.innerHTML='<span class="brand">안내</span><h1>이용 안내</h1>'+
  '<div class="consent" style="max-height:none;font-size:14.5px;line-height:1.85">본 자료는 <b>교육을 이수한 교육생에게 공개되는 자료</b>로, 해당 사원번호를 타인에게 대여 시 <b style="color:#D6403A">계정이 정지될 수 있음</b>을 안내드립니다.<br><br>'+
  '스스로 학습하는 목적 이외의 용도로 사용하지 마시고, 문의사항은 게시판을 활용하시거나 개별적인 연락 부탁드립니다.<br><br>'+
  '<b>현대해상화재보험 호남지역단 이승학 전임강사</b></div>'+
  '<p class="hint" style="margin:0 0 16px;text-align:right">버전 '+h(V.v||'')+(V.at?' · '+h(V.at):'')+'</p>'+
  '<button class="btn" id="go">확인했습니다</button>';
  card.querySelector('#go').onclick=go;
}
/* 비밀번호 분실: 관리자에게 초기화 요청만 남긴다 (로그인 없이) */
function viewForgot(){
  card.innerHTML='<span class="brand">비밀번호 찾기</span><h1>비밀번호 초기화 요청</h1><p class="sub">사번과 성명을 남기면 관리자에게 초기화 요청이 전달됩니다.</p><div class="msg"></div>'+
  '<label class="fld"><span>사번</span><input id="id" maxlength="6" autocapitalize="off" spellcheck="false" placeholder="예: AB1234"></label>'+
  '<label class="fld"><span>성명</span><input id="nm" autocomplete="name"></label>'+
  '<button class="btn" id="go">초기화 요청 보내기</button>'+
  '<p class="hint" style="margin-top:12px">관리자가 초기화하면 비밀번호가 <b>사번</b>으로 돌아갑니다. 사번으로 로그인한 뒤 새 비밀번호를 만들어 주세요.</p>'+
  '<div class="links"><button class="lnk" id="bk">← 로그인으로</button></div>';
  card.querySelector('#bk').onclick=function(){viewLogin();};
  var b=card.querySelector('#go');
  b.onclick=function(){var id=card.querySelector('#id').value,nm=card.querySelector('#nm').value;
    if(!A.validId(id)){msg('사번은 영문·숫자 6자리입니다.');return;} if(!nm.trim()){msg('성명을 입력해 주세요.');return;}
    busy(b,true); A.requestReset(id,nm).then(function(){
      card.innerHTML='<span class="brand">비밀번호 찾기</span><h1>요청이 접수되었습니다</h1><div class="msg ok show">관리자가 확인 후 초기화합니다. 초기화되면 <b>사번</b>을 비밀번호로 입력해 로그인하고 새 비밀번호를 만들어 주세요.</div><button class="btn sec" id="bk2">로그인으로</button>';
      card.querySelector('#bk2').onclick=function(){viewLogin();};
    }).catch(function(e){msg(e.userMsg||'요청을 보내지 못했습니다.');}).finally(function(){busy(b,false);});};
}

/* 시작: 이미 로그인돼 있으면 남은 단계로 */
(async function(){
  var s=A.session(), why=qs.get('why');
  if(s && why!=='expired'){ nextStep(s); return; }
  viewLogin(why==='expired'?{t:'로그인 시간이 지났거나 계정 정보가 바뀌었습니다. 다시 로그인해 주세요.',k:'info'}:null);
})();
})();
</script>
</body></html>
