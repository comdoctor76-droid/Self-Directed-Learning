<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영업전략 살펴보기 | 스스로 학습하기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;background:#FBF8F5;color:#26282C;font-size:17px;line-height:1.65}
.hero{background:linear-gradient(135deg,#1A2744 0%,#2C3F6E 60%,#3d5390 100%);color:#fff;padding:56px 20px 60px;position:relative}
.hero-in{max-width:1060px;margin:0 auto}
.badge{display:inline-block;background:#E8651A;color:#fff;font-weight:700;font-size:14px;padding:7px 16px;border-radius:999px;margin-bottom:16px}
.hero h1{font-size:34px;font-weight:900;line-height:1.35;margin-bottom:12px}
.hero p{font-size:17px;opacity:.92;max-width:620px}
.nav{position:sticky;top:0;z-index:50;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.1);display:flex;align-items:center;gap:6px;padding:0 8px;min-height:54px}
.nav-back{flex:0 0 auto;display:flex;align-items:center;gap:5px;font-size:14px;font-weight:800;color:#1A2744;text-decoration:none;padding:9px 12px;border-radius:999px;white-space:nowrap}
.nav-back:hover{background:#EBEFF8}
.nav-sep{flex:0 0 auto;width:1px;height:22px;background:#EEE7DF}
.nav-t{flex:1 1 auto;min-width:0;font-size:14.5px;font-weight:700;color:#6B7078;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-refresh{flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:#F7F2EB;border:1px solid #EEE7DF;color:#1A2744;font-size:16px;cursor:pointer}
.wrap{max-width:1060px;margin:0 auto;padding:40px 16px 60px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.bar h2{font-size:22px;font-weight:900;color:#1A2744}
.bar .no{display:block;color:#E8651A;font-weight:900;font-size:14px;letter-spacing:1.5px}
.btn{font-family:inherit;font-size:15px;font-weight:800;border:0;border-radius:12px;padding:11px 18px;cursor:pointer;background:#E8651A;color:#fff;box-shadow:0 4px 14px rgba(232,101,26,.3)}
.btn.sec{background:#fff;color:#1A2744;border:1.5px solid #EEE7DF;box-shadow:none}
.btn:disabled{opacity:.5;cursor:default}
.g{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.mcard{position:relative;text-align:left;font-family:inherit;color:inherit;background:#fff;border:2px solid #EEE7DF;border-radius:18px;overflow:hidden;box-shadow:0 4px 18px rgba(26,39,68,.06);cursor:pointer;padding:0;display:block;width:100%}
.mcard:active{border-color:#E8651A}
.mcard .thumb{height:160px;background:linear-gradient(135deg,#1A2744 0%,#2C3F6E 60%,#3d5390 100%) center/cover no-repeat;display:flex;align-items:center;justify-content:center;position:relative}
.mcard .thumb .ico{font-size:44px}
.mcard .thumb .menu{position:absolute;left:16px;bottom:12px;background:rgba(26,39,68,.72);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:13px;font-weight:800;padding:5px 12px;border-radius:999px}
.mcard .info{padding:18px 22px 20px}
.mcard h3{font-size:19px;font-weight:900;color:#1A2744;margin-bottom:4px;line-height:1.4}
.mcard p{font-size:14.5px;color:#6B7078}
.mcard .go{margin-top:12px;font-size:14px;font-weight:800;color:#E8651A}
.mcard.empty .go{color:#9AA0A8}
.mgroup{margin-bottom:34px}
.mg-back{display:inline-flex;align-items:center;gap:4px;margin:0 0 14px;background:#fff;border:1.5px solid #EEE7DF;border-radius:999px;padding:8px 14px;font-family:inherit;font-size:14px;font-weight:800;color:#1A2744;cursor:pointer}
.mg-back:active{transform:scale(.97)}
.mg-h{font-size:18px;font-weight:900;color:#1A2744;margin:0 0 12px;padding-left:10px;border-left:4px solid #E8651A}
.mcard.tool{border-color:#FFD2B5}
.mcard.tool .thumb{background-position:center top}
.mcard.tool .thumb .menu{background:#E8651A;border-color:rgba(255,255,255,.5)}
.tl{display:none;position:fixed;inset:0;z-index:10000;background:#fff;flex-direction:column}
.tl.on{display:flex}
/* 시뮬레이터가 열려 있으면 펜 도구는 숨김(시뮬레이터 하단 버튼을 가리지 않도록) */
body:has(#tl.on) #PENBAR,body:has(#tl.on) #PEN_CV{display:none!important}
.tl-top{display:flex;align-items:center;gap:8px;background:#1A2744;color:#fff;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
.tl-title{flex:1;font-size:15.5px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-b{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;font-size:17px;font-weight:900;cursor:pointer;font-family:inherit}
.tl iframe{flex:1;width:100%;height:100%;border:0;background:#f8fafc}
.mcard .adm{position:absolute;top:10px;right:10px;display:flex;gap:6px;z-index:2}
.mcard .adm span{background:rgba(255,255,255,.95);border:1px solid #EEE7DF;border-radius:999px;font-size:12.5px;font-weight:800;padding:5px 10px;color:#1A2744}
.mcard .adm span.del{color:#C0392B}
.note{background:#fff;border:2px dashed #EEE7DF;border-radius:16px;padding:26px;text-align:center;color:#6B7078;font-size:15px}
footer{background:#1A2744;color:rgba(255,255,255,.75);text-align:center;padding:34px 16px;font-size:14.5px;line-height:1.9}

/* ── 프레젠테이션 뷰어 ── */
.pv{position:fixed;inset:0;z-index:3000;background:#0f1524;display:none;flex-direction:column;color:#fff;touch-action:pan-y}
.pv.on{display:flex}
.pv-top{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(0,0,0,.25)}
.pv-title{flex:1 1 auto;min-width:0;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-count{flex:0 0 auto;font-weight:800;font-size:14px;color:#FFB37E}
.pv-ic{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pv-stage{flex:1 1 auto;min-height:0;position:relative}
.pv-scroll{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:8px 64px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-x pan-y}
.pv-scroll img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.45);background:#fff;user-select:none;-webkit-user-drag:none;display:block}
/* 가로 채우기(기본): 좌우 여백 없이 화면 폭에 꽉 채우고, 넘치면 위아래로 스크롤. 확대하면 좌우로도 스크롤 */
.pv-scroll.w{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;padding:0;overflow-x:auto}  /* 가운데 정렬이면 확대 시 왼쪽이 화면 밖(스크롤 불가)으로 잘린다 → 왼쪽 기준으로 두고 오른쪽으로만 넘치게 */
.pv-scroll.w img{flex:none;width:100%;height:auto;max-width:none;max-height:none;margin:auto 0;border-radius:0;box-shadow:none}
.pv-hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#fff;font-size:13.5px;font-weight:800;padding:7px 14px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:3;white-space:nowrap}
.pv-hint.on{opacity:1}
.pv-zm{flex:0 0 auto;display:flex;align-items:center;gap:2px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);height:38px;padding:0 4px}
.pv-zm button{width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:#fff;font-family:inherit;font-size:20px;font-weight:800;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pv-zm button:disabled{opacity:.3;cursor:default}
.pv-zm span{min-width:44px;text-align:center;font-size:13px;font-weight:800;color:#FFB37E}
.pv-md{flex:0 0 auto;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-family:inherit;font-size:13px;font-weight:800;padding:0 12px;height:38px;cursor:pointer;white-space:nowrap}
.pv-nav{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(15,21,36,.55);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;z-index:4}
.pv-nav:disabled{opacity:.2;cursor:default}
.pv-nav.l{left:8px}.pv-nav.r{right:8px}
/* 필기 도구 막대가 열려 있으면 오른쪽 화살표를 그 왼쪽으로 비켜 둔다 */
body:has(#PENBAR.open) .pv-nav.r{right:84px}
body:has(#PENBAR.open) .pv-scroll:not(.w){padding-right:132px}
.pv-prog{height:4px;background:rgba(255,255,255,.12)}
.pv-prog i{display:block;height:100%;background:#E8651A;width:0;transition:width .2s}
@media(max-width:640px){.pv-scroll{padding:6px 6px 62px}.pv-scroll.w{padding:0 0 62px}.pv-nav{top:auto;bottom:8px;transform:none;width:46px;height:46px}.pv-nav.l{left:calc(50% - 60px)}.pv-nav.r{right:calc(50% - 60px)}.pv-hint{bottom:66px}body:has(#PENBAR.open) .pv-nav.r{right:calc(50% - 60px)}body:has(#PENBAR.open) .pv-scroll:not(.w){padding-right:6px}.pv-md{padding:0 10px}}

/* ── 업로드 팝업 ── */
.up{position:fixed;inset:0;z-index:3100;background:rgba(10,16,30,.6);display:none;align-items:center;justify-content:center;padding:16px}
.up.on{display:flex}
.up-box{background:#fff;width:100%;max-width:460px;border-radius:20px;padding:22px 20px;box-shadow:0 12px 40px rgba(0,0,0,.35);max-height:92vh;overflow:auto}
.up-box h3{font-size:19px;font-weight:900;color:#1A2744;margin-bottom:14px}
.up-row{display:flex;gap:10px;margin-bottom:12px}
.up-f{display:block;margin-bottom:12px;flex:1}
.up-f>span{display:block;font-size:13.5px;font-weight:800;color:#1A2744;margin-bottom:5px}
.up-f select,.up-f input[type=text]{width:100%;font-family:inherit;font-size:16px;padding:10px 12px;border:1.5px solid #EEE7DF;border-radius:10px;background:#fff}
.up-file{display:block;border:2px dashed #F6C9A8;background:#FFF8F2;border-radius:12px;padding:16px;text-align:center;cursor:pointer;font-size:14.5px;color:#C94F0A;font-weight:700}
.up-file input{display:none}
.up-list{font-size:13.5px;color:#6B7078;margin:8px 2px 0;max-height:110px;overflow:auto}
.up-mode{font-size:14px;margin:12px 0 4px;display:none}
.up-mode label{margin-right:14px;cursor:pointer}
.up-msg{font-size:14px;font-weight:700;color:#1A2744;min-height:22px;margin:10px 0}
.up-msg.err{color:#C0392B}
.up-btns{display:flex;gap:8px;justify-content:flex-end}
.up-help{font-size:12.5px;color:#9AA0A8;margin-top:10px;line-height:1.6}
@media(max-width:760px){.hero{padding:44px 18px 46px}.hero h1{font-size:27px}}
</style>
</head>
<body>

<div class="hero"><div class="hero-in">
  <span class="badge">이달의 이슈</span>
  <h1>영업전략 살펴보기</h1>
  <p>이달의 영업전략들을 살펴 봅니다.</p>
</div></div>

<nav class="nav">
  <a href="index.html" class="nav-back">← <span>메인으로</span></a>
  <div class="nav-sep"></div>
  <div class="nav-t">📊 월별 영업전략 프레젠테이션</div>
  <button class="nav-refresh" onclick="location.href=location.pathname+'?_='+Date.now()" aria-label="새로고침" type="button">🔄</button>
</nav>

<div class="wrap">
  <div class="bar">
    <div><span class="no">MONTHLY</span><h2>월별 영업전략</h2></div>
    <button class="btn" id="upOpen" type="button" style="display:none">📤 자료 올리기</button>
  </div>
  <div id="months"></div>
</div>

<footer>
  본 자료는 이해를 돕기 위한 <b>교육용 자료</b>입니다.<br>© 스스로 학습하기
  <div style="margin-top:16px">
    <button id="adminBtn" type="button" onclick="AdminEditor.openLogin()"
      style="background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.28);color:rgba(255,255,255,.8);font-family:inherit;font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:999px;cursor:pointer">🔧 관리자</button>
  </div>
</footer>

<!-- 시뮬레이터 전체 화면 -->
<div class="tl" id="tl" role="dialog" aria-modal="true" aria-label="시뮬레이터" data-pen-skip>
  <div class="tl-top"><div class="tl-title" id="tlTitle"></div>
    <button class="tl-b" id="tlNew" type="button" title="새 창으로 열기">↗</button>
    <button class="tl-b" id="tlClose" type="button" aria-label="닫기">✕</button></div>
  <div id="tlBody" style="flex:1;display:flex;min-height:0"></div>
</div>

<!-- 프레젠테이션 뷰어 -->
<div class="pv" id="pv" role="dialog" aria-modal="true" aria-label="프레젠테이션">
  <div class="pv-top" data-pen-skip>
    <div class="pv-title" id="pvTitle"></div>
    <div class="pv-count" id="pvCount"></div>
    <button class="pv-md" id="pvMode" type="button" title="가로를 꽉 채우고 위아래로 스크롤하는 보기 ↔ 한 화면에 전체가 보이는 보기"></button>
    <div class="pv-zm" id="pvZm" title="확대 / 축소"><button id="pvZo" type="button" aria-label="축소">−</button><span id="pvZv">100%</span><button id="pvZi" type="button" aria-label="확대">＋</button></div>
    <button class="pv-ic" id="pvFs" type="button" aria-label="전체 화면">⛶</button>
    <button class="pv-ic" id="pvClose" type="button" aria-label="닫기">✕</button>
  </div>
  <div class="pv-prog"><i id="pvProg"></i></div>
  <div class="pv-stage" id="pvStage">
    <div class="pv-scroll" id="PVS"><img id="pvImg" alt=""></div>
    <div class="pv-hint" id="pvHint">↕ 위아래로 스크롤하세요</div>
    <button class="pv-nav l" id="pvPrev" type="button" aria-label="이전" data-pen-skip><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="pv-nav r" id="pvNext" type="button" aria-label="다음" data-pen-skip><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</div>

<!-- 자료 올리기 팝업 (관리자) -->
<div class="up" id="up">
  <div class="up-box">
    <h3>📤 프레젠테이션 자료 올리기</h3>
    <div class="up-row">
      <label class="up-f"><span>연도</span><select id="upYear"></select></label>
      <label class="up-f"><span>월</span><select id="upMonth"></select></label>
    </div>
    <label class="up-f"><span>카드 제목</span><input type="text" id="upTitle"></label>
    <label class="up-file">📎 사진 또는 PDF 파일 선택 (여러 개 가능)
      <input type="file" id="upFiles" multiple accept="image/*,application/pdf,.pdf">
    </label>
    <div class="up-list" id="upList"></div>
    <div class="up-mode" id="upMode">이 달에 이미 자료가 <b id="upHave"></b>장 있습니다:
      <label><input type="radio" name="upm" value="replace" checked> 새 자료로 교체</label>
      <label><input type="radio" name="upm" value="append"> 뒤에 이어 붙이기</label>
    </div>
    <div class="up-msg" id="upMsg"></div>
    <div class="up-btns">
      <button class="btn sec" id="upCancel" type="button">취소</button>
      <button class="btn" id="upGo" type="button">올리기</button>
    </div>
    <p class="up-help">PDF는 쪽마다 한 장의 슬라이드로 바뀝니다. 사진은 고른 순서(파일 이름 순)대로 넘어갑니다.<br>올린 뒤 1~2분이면 모든 사람에게 보입니다.</p>
  </div>
</div>

<script>
(function(){
"use strict";
var DATA_PATH='data/strategy.json', SLIDE_DIR='assets/strategy/';
var MAX_W=1920, JPG_Q=0.86;
var state={months:[]}, cur=null, idx=0;
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function isAdmin(){return !!(window.AdminEditor&&AdminEditor.isLoggedIn&&AdminEditor.isLoggedIn());}
function sortMonths(){state.months.sort(function(a,b){return a.id<b.id?1:-1;});}
function toast(m,err){if(window.AdminEditor&&AdminEditor.toast)AdminEditor.toast(m,err);else alert(m);}

/* ── 목록 ── */
var viewMonth=null;   /* 월 카드를 눌러 들어간 상태(그 달 id). null이면 월 목록 */
function render(){
  $('upOpen').style.display=(isAdmin()&&!viewMonth)?'':'none';
  var box=$('months'); sortMonths();
  if(!state.months.length){box.innerHTML='<div class="note">아직 올라온 영업전략 자료가 없습니다.</div>';return;}
  var vm=viewMonth?state.months.filter(function(x){return x.id===viewMonth;})[0]:null;
  if(viewMonth&&!vm)viewMonth=null;
  if(vm){ /* ── 월 안: 시뮬레이터 카드(상단) → 이달의 매거진 카드 ── */
    var mi=state.months.indexOf(vm), n2=(vm.slides||[]).length, f2=n2?vm.slides[0]:null;
    var tl=(vm.tools||[]).map(function(t,ti){
      return '<button type="button" class="mcard tool" data-i="'+mi+'" data-t="'+ti+'">'+
        '<div class="thumb"'+(t.thumb?' style="background-image:url(\''+esc(t.thumb)+'\')"':'')+'>'+(t.thumb?'':'<span class="ico">🧮</span>')+
        '<span class="menu">'+esc(t.tag||'시뮬레이터')+'</span></div>'+
        '<div class="info"><h3>'+esc(t.title)+'</h3><p>'+esc(t.desc||'')+'</p><div class="go">시뮬레이터 열기 →</div></div></button>';
    }).join('');
    box.innerHTML='<button type="button" class="mg-back" id="mgBack">← 월별 영업전략</button>'+
      '<section class="mgroup"><h3 class="mg-h">'+esc(vm.title||(vm.month+'월 영업전략'))+'</h3><div class="g">'+tl+
      '<button type="button" class="mcard mag'+(n2?'':' empty')+'" data-i="'+mi+'">'+
      '<div class="thumb"'+(f2?' style="background-image:url(\''+esc(f2)+'\')"':'')+'>'+(f2?'':'<span class="ico">📊</span>')+
      '<span class="menu">'+vm.year+'년 '+vm.month+'월</span></div>'+
      '<div class="info"><h3>이달의 매거진</h3><p>'+(n2?'슬라이드 '+n2+'장':'자료 준비 중')+'</p>'+
      '<div class="go">'+(n2?'프레젠테이션 보기 →':'곧 올라옵니다')+'</div></div></button></div></section>';
    return;
  }
  /* ── 월 목록: 월마다 카드 하나 (누르면 안으로) ── */
  box.innerHTML='<div class="g">'+state.months.map(function(m,i){
    var n=(m.slides||[]).length, first=n?m.slides[0]:null, cnt=(m.tools||[]).length+(n?1:0);

    var nw=im.offsetWidth||1, nh=im.offsetHeight||1;

}
function applyMode(resetScroll){
  var im=$('pvImg'), sc=$('PVS'); if(!im.naturalWidth)return;

/* 확대·축소: 가로 채우기 기준 100%~300%. '한 화면에' 보기에서 누르면 먼저 가로 채우기로 바꾼다 */
function setZoom(z){

/* 두 손가락 확대·축소(태블릿·휴대폰): 손가락 사이 거리 변화만큼 배율을 바꾸고, 두 손가락 가운데 지점이 그대로 그 자리에 있게 한다 */
(function(){
  var sc=$('PVS'), g=null;
  function dist(t){var dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY;return Math.sqrt(dx*dx+dy*dy);}
  function mid(t){return {x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2};}
  sc.addEventListener('touchstart',function(e){
    if(e.touches.length!==2){g=null;return;}
    if(!isW()){modePref='width';zoom=1;try{localStorage.setItem('strategy_view_mode2','width');}catch(x){}applyMode(false);}   /* '한 화면에' 보기에서 모으면 가로 채우기로 */
    var ir=$('pvImg').getBoundingClientRect(), m=mid(e.touches);
    g={d:Math.max(dist(e.touches),1),z:zoom,fx:(m.x-ir.left)/ir.width,fy:(m.y-ir.top)/ir.height};
  },{passive:true});
  sc.addEventListener('touchmove',function(e){
    if(!g||e.touches.length!==2)return;
    e.preventDefault();
    var z=Math.max(ZMIN,Math.min(ZMAX,g.z*dist(e.touches)/g.d)); zoom=Math.round(z*1000)/1000;
    applyZoom(false);
    var m=mid(e.touches), ir=$('pvImg').getBoundingClientRect();   /* 처음 집은 그림 위 지점이 두 손가락 가운데에 오도록 스크롤 보정 */
    sc.scrollLeft+=(ir.left+g.fx*ir.width)-m.x; sc.scrollTop+=(ir.top+g.fy*ir.height)-m.y;
  },{passive:false});
  function end(e){if(!e.touches||e.touches.length<2)g=null;}
  sc.addEventListener('touchend',end,{passive:true}); sc.addEventListener('touchcancel',end,{passive:true});
})();
$('PVS').addEventListener('wheel',function(e){if(e.ctrlKey){e.preventDefault();setZoom(zoom+(e.deltaY<0?ZSTEP:-ZSTEP));}},{passive:false});
function show(){

function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
function pdfLib(){
  if(window.pdfjsLib)return Promise.resolve(window.pdfjsLib);
  return loadScript('assets/vendor/pdf.min.js').then(function(){pdfjsLib.GlobalWorkerOptions.workerSrc='assets/vendor/pdf.worker.min.js';return pdfjsLib;});
}
function canvasToB64(cv){return new Promise(function(res){cv.toBlob(function(b){var fr=new FileReader();fr.onload=function(){var s=String(fr.result);res(s.slice(s.indexOf(',')+1));};fr.readAsDataURL(b);},'image/jpeg',JPG_Q);});}
function whiteCanvas(w,h){var cv=document.createElement('canvas');cv.width=w;cv.height=h;var c=cv.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,w,h);return cv;}
function imageToB64(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){var sc=Math.min(1,MAX_W/Math.max(im.naturalWidth,im.naturalHeight*16/9));
      var cv=whiteCanvas(Math.round(im.naturalWidth*sc),Math.round(im.naturalHeight*sc));cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);canvasToB64(cv).then(res);};
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('이미지를 읽지 못했습니다: '+file.name));};
    im.src=url;
  });
}
function pdfToB64s(file,out,label){
  return pdfLib().then(function(lib){return file.arrayBuffer().then(function(buf){return lib.getDocument({data:buf}).promise;});})
  .then(function(doc){
    var chain=Promise.resolve();
    for(var p=1;p<=doc.numPages;p++)(function(p){chain=chain.then(function(){
      msg(label+' — '+p+' / '+doc.numPages+'쪽 변환 중…');
      return doc.getPage(p).then(function(pg){
        var v1=pg.getViewport({scale:1}),sc=Math.min(3,MAX_W/v1.width),vp=pg.getViewport({scale:sc});
        var cv=whiteCanvas(Math.round(vp.width),Math.round(vp.height));
        return pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise.then(function(){return canvasToB64(cv);}).then(function(b){out.push(b);cv.width=cv.height=0;});
      });
    });})(p);
    return chain;
  });
}

/* GitHub Git Data API: 파일 여러 개 + 목록(json)을 커밋 한 번으로 저장 */
function gh(){return AdminEditor.gh;}
function gapi(path,opt){
  var R=gh().repo; opt=opt||{};
  return fetch('https://api.github.com/repos/'+R.owner+'/'+R.repo+'/git/'+path,{method:opt.method||'GET',
    headers:Object.assign({'Content-Type':'application/json'},gh().hdr()),body:opt.body?JSON.stringify(opt.body):undefined,cache:'no-store'})
  .then(function(r){if(!r.ok){var e=new Error('GitHub '+r.status);e.status=r.status;throw e;}return r.json();});
}
function commitFiles(files,deletes,message){
  var R=gh().repo, base;
  return gapi('ref/heads/'+R.branch).then(function(ref){base=ref.object.sha;return gapi('commits/'+base);})
  .then(function(c){
    var tree=[], chain=Promise.resolve();
    files.forEach(function(f,i){chain=chain.then(function(){
      if(f.label)msg(f.label);
      return gapi('blobs',{method:'POST',body:{content:f.b64,encoding:'base64'}}).then(function(b){tree.push({path:f.path,mode:'100644',type:'blob',sha:b.sha});});
    });});
    return chain.then(function(){
      (deletes||[]).forEach(function(p){tree.push({path:p,mode:'100644',type:'blob',sha:null});});
      return gapi('trees',{method:'POST',body:{base_tree:c.tree.sha,tree:tree}});
    });
  })
  .then(function(t){return gapi('commits',{method:'POST',body:{message:message,tree:t.sha,parents:[base]}});})
  .then(function(nc){return gapi('refs/heads/'+R.branch,{method:'PATCH',body:{sha:nc.sha}});});
}
function freshData(){
  return gh().get(DATA_PATH).then(function(r){try{var d=JSON.parse(r.text);return d&&d.months?d:{months:[]};}catch(e){return {months:[]};}});
}

$('upGo').onclick=function(){
  if(!isAdmin()){AdminEditor.openLogin();return;}
  if(!picked.length){msg('사진이나 PDF 파일을 골라 주세요.',true);return;}
  var y=+$('upYear').value,m=+$('upMonth').value,id=y+'-'+(m<10?'0':'')+m;
  var title=$('upTitle').value.trim()||(m+'월 영업전략');
  var mode=(document.querySelector('input[name=upm]:checked')||{}).value||'replace';
  var b64s=[], btn=$('upGo'); btn.disabled=true;
  var chain=Promise.resolve();
  picked.forEach(function(f,i){chain=chain.then(function(){
    var lab='파일 '+(i+1)+'/'+picked.length+' '+f.name;
    if(f.type==='application/pdf'||/\.pdf$/i.test(f.name))return pdfToB64s(f,b64s,lab);
    msg(lab+' 변환 중…'); return imageToB64(f).then(function(b){b64s.push(b);});
  });});
  var stamp=Date.now().toString(36), paths=[], deletes=[];
  chain.then(function(){
    if(!b64s.length)throw new Error('변환된 슬라이드가 없습니다.');
    msg('저장소 목록 확인 중…');
    return freshData();
  }).then(function(d){
    var ex=d.months.filter(function(x){return x.id===id;})[0];
    if(!ex){ex={id:id,year:y,month:m,title:title,slides:[]};d.months.push(ex);}
    ex.title=title;
    if(mode==='replace'){deletes=(ex.slides||[]).filter(function(p){return p.indexOf(SLIDE_DIR)===0;});ex.slides=[];}
    var files=b64s.map(function(b,i){var p=SLIDE_DIR+id+'/'+stamp+'-'+(i<9?'0':'')+(i+1)+'.jpg';paths.push(p);
      return {path:p,b64:b,label:'업로드 '+(i+1)+' / '+b64s.length+'장…'};});
    ex.slides=(ex.slides||[]).concat(paths);
    d.months.sort(function(a,b){return a.id<b.id?1:-1;});
    files.push({path:DATA_PATH,b64:gh().b64enc(JSON.stringify(d,null,2)+'\n'),label:'목록 저장 중…'});
    return commitFiles(files,deletes,'영업전략 자료 업로드: '+id+' ('+b64s.length+'장)').then(function(){return d;});
  }).then(function(d){
    /* 사이트 재배포 전에도 관리자 화면에서 바로 보이도록 이번에 만든 이미지를 임시로 연결 */
    var mine=d.months.filter(function(x){return x.id===id;})[0];
    var local={}; paths.forEach(function(p,i){local[p]='data:image/jpeg;base64,'+b64s[i];});
    mine.slides=mine.slides.map(function(p){return local[p]||p;});
    state=d; render(); closeUp(); btn.disabled=false;
    toast('올렸습니다! '+b64s.length+'장 · 1~2분 뒤 모두에게 보입니다 ✅');
  }).catch(function(e){
    btn.disabled=false;
    msg('올리지 못했습니다: '+(e&&e.status?gh().err(e.status):(e&&e.message)||e),true);
  });
};

function delMonth(m){
  if(!isAdmin())return;
  if(!confirm(m.year+'년 '+m.month+'월 「'+(m.title||'')+'」 자료를 삭제할까요? 카드도 함께 사라집니다.'))return;
  toast('삭제 중…');
  freshData().then(function(d){
    var ex=d.months.filter(function(x){return x.id===m.id;})[0];
    var dels=ex?(ex.slides||[]).filter(function(p){return p.indexOf(SLIDE_DIR)===0;}):[];
    d.months=d.months.filter(function(x){return x.id!==m.id;});
    return commitFiles([{path:DATA_PATH,b64:gh().b64enc(JSON.stringify(d,null,2)+'\n')}],dels,'영업전략 자료 삭제: '+m.id).then(function(){return d;});
  }).then(function(d){state=d;render();toast('삭제했습니다. 1~2분 뒤 모두에게 반영됩니다');})
  .catch(function(e){toast('삭제 실패: '+(e&&e.status?gh().err(e.status):(e&&e.message)),true);});
}

document.addEventListener('admin-login',render);
document.addEventListener('admin-logout',render);
load();
})();
</script>
