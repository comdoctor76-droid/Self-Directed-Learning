<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1524">
<title>강사용 프리젠테이션</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0f1524;font-family:'Noto Sans KR',-apple-system,'Malgun Gothic',sans-serif;overflow:hidden}
button{font-family:inherit}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:700}
/* ── 프레젠테이션 뷰어 ── */
.pv{position:fixed;inset:0;z-index:3000;background:#0f1524;display:none;flex-direction:column;color:#fff;touch-action:pan-y}
.pv.on{display:flex}
.pv-top{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(0,0,0,.25)}
.pv-title{flex:0 1 auto;min-width:0;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-pen{flex:0 0 auto;display:flex}
.pv-count{margin-left:auto;flex:0 0 auto;font-weight:800;font-size:14px;color:#FFB37E}
.pv-ic{flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pv-stage{flex:1 1 auto;min-height:0;position:relative}
.pv-scroll{position:absolute;inset:0;overflow-x:hidden;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:8px 64px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-x pan-y}
.pv-scroll img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 10px 40px rgba(0,0,0,.45);background:#fff;user-select:none;-webkit-user-drag:none;display:block}
/* 가로 채우기(기본): 좌우 여백 없이 화면 폭에 꽉 채우고, 넘치면 위아래로 스크롤. 확대하면 좌우로도 스크롤 */
.pv-scroll.w{display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;padding:0;overflow-x:auto}  /* 가운데 정렬이면 확대 시 왼쪽이 화면 밖(스크롤 불가)으로 잘린다 → 왼쪽 기준으로 두고 오른쪽으로만 넘치게 */
.pv-scroll.w img{flex:none;width:100%;height:auto;max-width:none;max-height:none;margin:auto 0;border-radius:0;box-shadow:none}
.pv-hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#fff;font-size:13.5px;font-weight:800;padding:7px 14px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .3s;z-index:3;white-space:nowrap}
.pv-hint.on{opacity:1}
.pv-zm{flex:0 0 auto;display:flex;align-items:center;gap:2px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);height:38px;padding:0 4px}
.pv-zm button{width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:#fff;font-family:inherit;font-size:20px;font-weight:800;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pv-zm button:disabled{opacity:.3;cursor:default}
.pv-zm span{min-width:44px;text-align:center;font-size:13px;font-weight:800;color:#FFB37E}
.pv-md{flex:0 0 auto;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-family:inherit;font-size:13px;font-weight:800;padding:0 12px;height:38px;cursor:pointer;white-space:nowrap}
.pv-nav{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(15,21,36,.55);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;z-index:4}
.pv-nav:disabled{opacity:.2;cursor:default}
.pv-nav.l{left:8px}.pv-nav.r{right:8px}
/* 필기 도구 막대가 열려 있으면 오른쪽 화살표를 그 왼쪽으로 비켜 둔다 */
.pv-prog{height:4px;background:rgba(255,255,255,.12)}
.pv-prog i{display:block;height:100%;background:#E8651A;width:0;transition:width .2s}
@media(max-width:640px){.pv-top{gap:6px}.pv-title{display:none}.pv-zm,#pvFs{display:none!important}.pv-scroll{padding:6px 6px 62px}.pv-scroll.w{padding:0 0 62px}.pv-nav{top:auto;bottom:8px;transform:none;width:46px;height:46px}.pv-nav.l{left:calc(50% - 60px)}.pv-nav.r{right:calc(50% - 60px)}.pv-hint{bottom:66px}.pv-md{padding:0 10px}}
</style>
</head>
<body>
<div id="loading">불러오는 중…</div>

<div class="pv" id="pv" role="dialog" aria-modal="true" aria-label="프레젠테이션">
  <div class="pv-top" data-pen-skip>
    <div class="pv-title" id="pvTitle"></div>
    <span class="pv-pen" id="pvPenSlot" data-pen-skip></span>
    <div class="pv-count" id="pvCount"></div>
    <button class="pv-md" id="pvMode" type="button" title="가로를 꽉 채우고 위아래로 스크롤하는 보기 ↔ 한 화면에 전체가 보이는 보기"></button>
    <div class="pv-zm" id="pvZm" title="확대 / 축소"><button id="pvZo" type="button" aria-label="축소">−</button><span id="pvZv">100%</span><button id="pvZi" type="button" aria-label="확대">＋</button></div>
    <button class="pv-ic" id="pvFs" type="button" aria-label="전체 화면">⛶</button>
    <button class="pv-ic" id="pvClose" type="button" aria-label="닫기">✕</button>
  </div>
  <div class="pv-prog"><i id="pvProg"></i></div>
  <div class="pv-stage" id="pvStage">
    <div class="pv-scroll" id="PVS"><img id="pvImg" alt=""></div>
    <div class="pv-hint" id="pvHint">↕ 위아래로 스크롤하세요</div>
    <button class="pv-nav l" id="pvPrev" type="button" aria-label="이전" data-pen-skip><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="pv-nav r" id="pvNext" type="button" aria-label="다음" data-pen-skip><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
</div>

<script src="pen.js"></script>
<script>
(function(){
"use strict";
var Q=new URLSearchParams(location.search), DECK=(Q.get('d')||'priority').replace(/[^a-z0-9_-]/gi,'');
var DATA_PATH='data/'+DECK+'-deck.json', BACK='index.html';
var cur=null, idx=0;
var $=function(id){return document.getElementById(id);};

/* ── 프레젠테이션 뷰어 ── */
function openViewer(m,i){cur=m;idx=i||0;zoom=1;$('pv').classList.add('on');show();}
function closeViewer(){
  if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(function(){});
  if(history.length>1&&document.referrer){history.back();}else{location.href=BACK;}
}
var modePref=null, hintT=0, zoom=1;   /* modePref: 'width'(기본: 가로 채우기) | 'fit'(한 화면에) — 버튼으로 고른 보기 방식 */
var ZMIN=1, ZMAX=3, ZSTEP=0.25;
try{var mp=localStorage.getItem('deck_view_mode');modePref=(mp==='fit'||mp==='width')?mp:null;}catch(e){}
function isW(){return (modePref||(innerWidth>innerHeight?'fit':'width'))==='width';}   /* 가로 화면은 슬라이드 한 장이 통째로 보이게, 세로 화면은 가로 채우기 */
function applyZoom(keep){
  var sc=$('PVS'), im=$('pvImg'), w=isW();
  var cx=sc.scrollLeft+sc.clientWidth/2, cy=sc.scrollTop+sc.clientHeight/2, ow=im.offsetWidth||1, oh=im.offsetHeight||1;
  im.style.width=(w&&zoom!==1)?(zoom*100)+'%':'';
  $('pvZv').textContent=Math.round(zoom*100)+'%';
  $('pvZo').disabled=zoom<=ZMIN+0.001; $('pvZi').disabled=zoom>=ZMAX-0.001;
  if(keep&&w){   /* 확대·축소해도 보고 있던 가운데 지점이 유지되게 */
    var nw=im.offsetWidth||1, nh=im.offsetHeight||1;
    sc.scrollLeft=cx/ow*nw-sc.clientWidth/2; sc.scrollTop=cy/oh*nh-sc.clientHeight/2;
  }
}
function applyMode(resetScroll){
  var im=$('pvImg'), sc=$('PVS'); if(!im.naturalWidth)return;
  var w=isW();
  sc.classList.toggle('w',w);
  if(resetScroll!==false){sc.scrollTop=0;sc.scrollLeft=0;}
  var b=$('pvMode'); b.textContent=w?'▣ 한 화면에':'↔ 가로 채우기';
  b.setAttribute('aria-label',b.textContent);
  applyZoom(false);
  clearTimeout(hintT); $('pvHint').classList.remove('on');
  if(w&&sc.scrollHeight>sc.clientHeight+8){$('pvHint').classList.add('on');hintT=setTimeout(function(){$('pvHint').classList.remove('on');},2600);}
}
$('pvImg').addEventListener('load',function(){applyMode();});
window.addEventListener('resize',function(){if($('pv').classList.contains('on'))applyMode(false);});
$('pvMode').onclick=function(){
  modePref=isW()?'fit':'width'; zoom=1;
  try{localStorage.setItem('deck_view_mode',modePref);}catch(e){}
  applyMode();
};
/* 확대·축소: 가로 채우기 기준 100%~300%. '한 화면에' 보기에서 누르면 먼저 가로 채우기로 바꾼다 */
function setZoom(z){
  z=Math.max(ZMIN,Math.min(ZMAX,Math.round(z*100)/100));
  if(!isW()){modePref='width';try{localStorage.setItem('deck_view_mode','width');}catch(e){}zoom=z;applyMode();return;}
  if(z===zoom)return; zoom=z; applyZoom(true);
}
$('pvZi').onclick=function(){setZoom(zoom+ZSTEP);};
$('pvZo').onclick=function(){setZoom(zoom-ZSTEP);};
/* 두 손가락 확대·축소(태블릿·휴대폰): 손가락 사이 거리 변화만큼 배율을 바꾸고, 두 손가락 가운데 지점이 그대로 그 자리에 있게 한다 */
(function(){
  var sc=$('PVS'), g=null;
  function dist(t){var dx=t[0].clientX-t[1].clientX,dy=t[0].clientY-t[1].clientY;return Math.sqrt(dx*dx+dy*dy);}
  function mid(t){return {x:(t[0].clientX+t[1].clientX)/2,y:(t[0].clientY+t[1].clientY)/2};}
  sc.addEventListener('touchstart',function(e){
    if(e.touches.length!==2){g=null;return;}
    if(!isW()){modePref='width';zoom=1;try{localStorage.setItem('deck_view_mode','width');}catch(x){}applyMode(false);}   /* '한 화면에' 보기에서 모으면 가로 채우기로 */
    var ir=$('pvImg').getBoundingClientRect(), m=mid(e.touches);
    g={d:Math.max(dist(e.touches),1),z:zoom,fx:(m.x-ir.left)/ir.width,fy:(m.y-ir.top)/ir.height};
  },{passive:true});
  sc.addEventListener('touchmove',function(e){
    if(!g||e.touches.length!==2)return;
    e.preventDefault();
    var z=Math.max(ZMIN,Math.min(ZMAX,g.z*dist(e.touches)/g.d)); zoom=Math.round(z*1000)/1000;
    applyZoom(false);
    var m=mid(e.touches), ir=$('pvImg').getBoundingClientRect();   /* 처음 집은 그림 위 지점이 두 손가락 가운데에 오도록 스크롤 보정 */
    sc.scrollLeft+=(ir.left+g.fx*ir.width)-m.x; sc.scrollTop+=(ir.top+g.fy*ir.height)-m.y;
  },{passive:false});
  function end(e){if(!e.touches||e.touches.length<2)g=null;}
  sc.addEventListener('touchend',end,{passive:true}); sc.addEventListener('touchcancel',end,{passive:true});
})();
$('PVS').addEventListener('wheel',function(e){if(e.ctrlKey){e.preventDefault();setZoom(zoom+(e.deltaY<0?ZSTEP:-ZSTEP));}},{passive:false});
function show(){
  var s=cur.slides, n=s.length; idx=Math.max(0,Math.min(n-1,idx));
  var im=$('pvImg'); im.setAttribute('data-i',idx); $('PVS').scrollTop=0;
  im.src=s[idx]; im.alt=(cur.title||'')+' '+(idx+1)+'쪽';
  if(im.complete&&im.naturalWidth)applyMode();
  $('pvTitle').textContent=cur.title||''; $('pvCount').textContent=(idx+1)+' / '+n;
  $('pvProg').style.width=((idx+1)/n*100)+'%';
  $('pvPrev').disabled=idx<=0; $('pvNext').disabled=idx>=n-1;
  [idx+1,idx-1].forEach(function(k){if(k>=0&&k<n){var pi=new Image();pi.src=s[k];}});
}
function go(d){if(!cur)return;var n=cur.slides.length,k=idx+d;if(k<0||k>=n)return;idx=k;show();}
$('pvPrev').onclick=function(){go(-1);}; $('pvNext').onclick=function(){go(1);};
$('pvClose').onclick=closeViewer;
var fsOk=!!(document.documentElement.requestFullscreen);
$('pvFs').style.display=fsOk?'':'none';
$('pvFs').onclick=function(){if(document.fullscreenElement)document.exitFullscreen();else $('pv').requestFullscreen().catch(function(){});};
document.addEventListener('keydown',function(e){
  if(!$('pv').classList.contains('on'))return;
  var sc=$('PVS'), w=sc.classList.contains('w');
  if(e.key==='ArrowDown'){e.preventDefault();sc.scrollBy({top:140,behavior:'smooth'});}
  else if(e.key==='ArrowUp'){e.preventDefault();sc.scrollBy({top:-140,behavior:'smooth'});}
  else if(e.key==='PageDown'||e.key===' '){e.preventDefault();
    if(w&&sc.scrollTop+sc.clientHeight<sc.scrollHeight-4)sc.scrollBy({top:sc.clientHeight*0.85,behavior:'smooth'});else go(1);}
  else if(e.key==='PageUp'){e.preventDefault();
    if(w&&sc.scrollTop>4)sc.scrollBy({top:-sc.clientHeight*0.85,behavior:'smooth'});else go(-1);}
  else if(e.key==='+'||e.key==='='){e.preventDefault();setZoom(zoom+ZSTEP);}
  else if(e.key==='-'||e.key==='_'){e.preventDefault();setZoom(zoom-ZSTEP);}
  else if(e.key==='ArrowRight'){e.preventDefault();go(1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
  else if(e.key==='Escape'&&!document.fullscreenElement)closeViewer();
});
(function(){var x0=null,y0=0;var st=$('pvStage');
  st.addEventListener('touchstart',function(e){if(e.touches.length!==1){x0=null;return;}x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  st.addEventListener('touchend',function(e){if(x0==null)return;if(window.PenState&&PenState.drawingWithTouch()){x0=null;return;}var sc0=$('PVS');if(sc0.scrollWidth>sc0.clientWidth+4){x0=null;return;}var t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
    if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3)go(dx<0?1:-1);},{passive:true});
})();


/* ── 불러오기 ── */
fetch(DATA_PATH+'?_='+Date.now()).then(function(r){if(!r.ok)throw new Error(r.status);return r.json();}).then(function(d){
  if(d.back)BACK=d.back;
  if(!d.slides||!d.slides.length)throw new Error('empty');
  document.title=d.title||document.title;
  $('loading').style.display='none';
  var p=parseInt(Q.get('p'),10);
  openViewer({title:d.title,slides:d.slides},(p>=1&&p<=d.slides.length)?p-1:0);
}).catch(function(){$('loading').textContent='프리젠테이션을 불러오지 못했습니다.';});
})();
</script>
</body>
</html>
