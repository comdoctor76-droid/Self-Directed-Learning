<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3대질병 가입의 우선순위</title>
  <!-- Tailwind·아이콘은 사이트 안에 포함 (외부 CDN 없이 동작) -->
  <link rel="stylesheet" href="priority3.css?v=67">
  <!-- Google Fonts: Noto Sans KR & 손글씨 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* 16:9 비율 유지 */
    .canvas-16-9 {
      min-height: clamp(380px, 52vw, 600px);   /* 글이 길면 이보다 더 늘어난다 */
    }

    /* 손글씨 폰트 강제 적용 */
    .font-pen {
      font-family: 'Nanum Pen Script', cursive !important;
    }

    /* 귀여운 인포그래픽 텍스트 입체 효과 */
    .text-pop {
      text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.9), 3px 3px 5px rgba(249, 115, 22, 0.15);
    }

    /* 단계별 애니메이션 전환 */
    .step-obj {
      transition: all 0.5s cubic-bezier(0.34, 1.25, 0.64, 1);
    }
    .step-hidden {
      opacity: 0;
      transform: scale(0.8) translateY(10px);
      pointer-events: none;
      visibility: hidden;
    }
    .step-visible {
      opacity: 1;
      transform: scale(1) translateY(0);
      pointer-events: auto;
      visibility: visible;
    }

    /* 방금 등장한 요소 하이라이트 (통통 튀는 효과) */
    @keyframes bounceFocus {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }
    .active-highlight {
      animation: bounceFocus 1.2s ease-in-out infinite;
      z-index: 30;
    }

    /* 하단 가로 나열 텍스트 단어 효과 */
    .word-active {
      transform: scale(1.2) translateY(-2px);
      font-weight: 900 !important;
    }

    /* 오렌지톤 스케치북 모눈 배경 질감 */
    .bg-sketch-canvas {
      background-color: #fffaf5;
      background-image: 
        linear-gradient(to right, rgba(249, 115, 22, 0.1) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(249, 115, 22, 0.1) 1px, transparent 1px);
      background-size: 24px 24px;
    }
    /* ── 사이트 삽입용 보정 ──
       · 원이 타원으로 늘어나지 않게 폭 기준 정사각형으로 고정
       · 휴대폰(640px 이하)은 16:9 고정을 풀고 글자 크기를 줄여 겹치지 않게 */
    html, body { overflow-x: hidden; max-width: 100%; }
    .nav-arrow { position: absolute; top: 46%; transform: translateY(-50%); z-index: 40; width: 44px; height: 44px; border-radius: 9999px; border: 2px solid #fed7aa; background: rgba(255,255,255,.92); color: #ea580c; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(249,115,22,.25); cursor: pointer; transition: transform .12s, opacity .2s; -webkit-tap-highlight-color: transparent; }
    .nav-arrow:active { transform: translateY(-50%) scale(.92); }
    .nav-arrow.nav-l { left: 6px; } .nav-arrow.nav-r { right: 6px; }
    .nav-arrow[disabled] { opacity: .3; cursor: default; }
    @media (max-width: 640px) { .nav-arrow { width: 36px; height: 36px; } .nav-arrow svg { width: 18px; height: 18px; } .nav-arrow.nav-l { left: 2px; } .nav-arrow.nav-r { right: 2px; } }
    .circle-wrap { width: min(42vw, 320px, calc(56.25vw - 250px)) !important; min-width: 120px; height: auto !important; max-height: none !important; flex: 0 0 auto; }
    @media (max-width: 900px) {
      .canvas-16-9 { min-height: 0; }
      .circle-wrap { width: min(40vw, 320px) !important; }
      .ttl-big { font-size: clamp(2.5rem, 9vw, 5rem) !important; }
      .lbl-big { font-size: clamp(1.45rem, 5.6vw, 3.2rem) !important; }
      .lbl-sub { font-size: clamp(1.2rem, 4.2vw, 2.5rem) !important; }
      .lbl-col { gap: clamp(.5rem, 2vw, 1.5rem) !important; }
      main > div:nth-child(2) { margin-top: 2px !important; padding: 4px 0 6px; }
    }
    @media (max-width: 640px) {
      header h1 { font-size: 1.05rem !important; }
    }
  </style>
</head>

<body class="bg-transparent text-stone-800 flex flex-col items-center p-1 sm:p-2 font-sans select-none overflow-x-hidden" style="font-family:'Noto Sans KR',sans-serif">

  <div class="w-full max-w-6xl mx-auto flex flex-col items-center">
    
    <!-- Top Header (현대해상 오렌지 톤) -->
    <header class="w-full flex items-center justify-between mb-3 px-2">
      <div class="flex items-center gap-3">
        <span class="w-10 h-10 rounded-2xl bg-orange-500 text-white flex items-center justify-center text-2xl shadow-lg shadow-orange-500/30 font-bold">
          <span style="font-size:1.35rem;line-height:1">💡</span>
        </span>
        <div>
          <h1 class="text-lg sm:text-2xl font-black tracking-tight text-stone-800 flex items-center gap-2">
            3대질병 가입의 우선순위
            <span class="hidden sm:inline text-xs font-bold px-2.5 py-0.5 rounded-full bg-orange-100 text-orange-600 border border-orange-200">
              인포그래픽 가이드
            </span>
          </h1>
        </div>
      </div>

      <!-- Mode & Step Indicator -->
      <div class="flex items-center gap-2">
        <button id="modeToggleBtn" class="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-white text-stone-600 hover:text-orange-500 hover:bg-orange-50 border border-stone-200 text-xs font-bold transition shadow-sm">
          <span class="text-orange-400">⚙</span>
          <span id="modeToggleText">5개 핵심 모드</span>
        </button>
        <div class="flex items-center gap-2 bg-white px-4 py-1.5 rounded-xl border border-stone-200 shadow-sm">
          <span class="text-xs text-stone-500 font-bold">진행도</span>
          <div class="flex items-baseline font-black text-sm sm:text-base text-orange-500">
            <span id="stepCounterNumber">1</span>
            <span class="text-stone-400 text-xs ml-1 font-bold" id="totalStepNumber">/ 22</span>
          </div>
        </div>
      </div>
    </header>

    <!-- 16:9 Screen Main Sketchboard -->
    <main class="w-full canvas-16-9 bg-sketch-canvas rounded-[2rem] border-[6px] border-orange-100 shadow-[0_20px_50px_-15px_rgba(249,115,22,0.2)] relative overflow-hidden flex flex-col justify-between p-3 sm:p-5 md:p-6 text-stone-900">
      <button id="prevBtn" type="button" aria-label="이전" class="nav-arrow nav-l"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button id="nextBtn" type="button" aria-label="다음" class="nav-arrow nav-r"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      
      <!-- Top Title Texts (Step 12: 암 / Step 11: 2대질병) - 붉은 원 제거 및 텍스트 부각 -->
      <div class="w-full grid grid-cols-2 gap-6 relative z-20 pt-2">
        
        <!-- TOP LEFT: [암] 텍스트 (Step 12) -->
        <div class="flex items-center justify-center">
          <div id="step-elem-12" class="step-obj step-hidden flex items-center justify-center">
            <span class="ttl-big font-pen text-6xl sm:text-[5.5rem] font-bold text-orange-500 tracking-widest whitespace-nowrap text-pop drop-shadow-md">
              암
            </span>
          </div>
        </div>

        <!-- TOP RIGHT: [2대질병] 텍스트 (Step 11) -->
        <div class="flex items-center justify-center">
          <div id="step-elem-11" class="step-obj step-hidden flex items-center justify-center">
            <span class="ttl-big font-pen text-6xl sm:text-[5.5rem] font-bold text-teal-500 tracking-widest whitespace-nowrap text-pop drop-shadow-md">
              2대질병
            </span>
          </div>
        </div>

      </div>

      <!-- Center Main Comparison Area: 2 Large Prominent Circles Filling Canvas -->
      <div class="w-full flex-1 flex items-center justify-around gap-2 sm:gap-6 px-1 sm:px-4 relative z-10 min-h-0 -mt-4">

        <!-- ================= LEFT CIRCLE: 암 영역 (오렌지톤) ================= -->
        <div class="circle-wrap flex justify-center items-center h-full max-h-[280px] sm:max-h-[320px] aspect-square w-full">
          <!-- Outer Orange Circle: 암 -->
          <div id="step-elem-1" class="step-obj step-hidden w-full h-full rounded-full border-[5px] border-orange-400 bg-orange-100/40 relative flex items-center justify-center p-2 sm:p-4 shadow-inner">
            
            <div class="w-full flex items-center justify-between gap-1">
              <!-- Left Sub-Circle: [진단금] 귀여운 점선 원 -->
              <div class="relative w-[52%] aspect-square flex items-center justify-center">
                <div id="step-elem-3" class="step-obj step-hidden w-full h-full rounded-full border-[4px] border-orange-400 border-dashed bg-white/60 flex items-center justify-center p-1 shadow-sm">
                  <!-- 붉은 박스 제거, 글자 크기 극대화 -->
                  <div id="step-elem-5" class="step-obj step-hidden flex items-center justify-center">
                    <span class="lbl-big font-pen text-5xl sm:text-7xl font-bold text-orange-600 whitespace-nowrap text-pop -rotate-3">
                      치료비
                    </span>
                  </div>
                </div>
              </div>

              <!-- Right Column: [치료비] & [= 빚] -->
              <div class="w-[45%] lbl-col flex flex-col items-center justify-center gap-6 sm:gap-10">
                <div id="step-elem-7" class="step-obj step-hidden flex items-center justify-center">
                  <span class="lbl-sub font-pen text-4xl sm:text-[3.5rem] font-bold text-orange-400 whitespace-nowrap text-pop">
                    병원비
                  </span>
                </div>
                <div id="step-elem-10" class="step-obj step-hidden flex items-center justify-center">
                  <span class="lbl-sub font-pen text-4xl sm:text-[3.5rem] font-bold text-stone-400 whitespace-nowrap text-pop">
                    = 빚
                  </span>
                </div>
              </div>
            </div>

          </div>
        </div>

        <!-- ================= RIGHT CIRCLE: 2대질병 영역 (틸톤) ================= -->
        <div class="circle-wrap flex justify-center items-center h-full max-h-[280px] sm:max-h-[320px] aspect-square w-full">
          <!-- Outer Teal Circle: 2대질병 -->
          <div id="step-elem-2" class="step-obj step-hidden w-full h-full rounded-full border-[5px] border-teal-400 bg-teal-100/40 relative flex items-center justify-center p-2 sm:p-4 shadow-inner">
            
            <div class="w-full flex items-center justify-between gap-1">
              <!-- Left Column: [진단금] & [= 위로금] -->
              <div class="w-[45%] lbl-col flex flex-col items-center justify-center gap-6 sm:gap-10">
                <div id="step-elem-8" class="step-obj step-hidden flex items-center justify-center">
                  <span class="lbl-sub font-pen text-4xl sm:text-[3.5rem] font-bold text-teal-400 whitespace-nowrap text-pop">
                    치료비
                  </span>
                </div>
                <div id="step-elem-9" class="step-obj step-hidden flex items-center justify-center">
                  <span class="lbl-sub font-pen text-4xl sm:text-[3.5rem] font-bold text-stone-400 whitespace-nowrap text-pop">
                    = 위로금
                  </span>
                </div>
              </div>

              <!-- Right Sub-Circle: [치료비] 귀여운 점선 원 -->
              <div class="relative w-[52%] aspect-square flex items-center justify-center">
                <div id="step-elem-4" class="step-obj step-hidden w-full h-full rounded-full border-[4px] border-teal-400 border-dashed bg-white/60 flex items-center justify-center p-1 shadow-sm">
                  <!-- 붉은 박스 제거, 글자 크기 극대화 -->
                  <div id="step-elem-6" class="step-obj step-hidden flex items-center justify-center">
                    <span class="lbl-big font-pen text-5xl sm:text-7xl font-bold text-teal-600 whitespace-nowrap text-pop rotate-3">
                      병원비
                    </span>
                  </div>
                </div>
              </div>
            </div>

          </div>
        </div>

      </div>

      <!-- Bottom Detailed Comparison Area (수평 나열) -->
      <div class="w-full grid grid-cols-2 gap-2 sm:gap-6 px-1 sm:px-2 z-20 mt-1 mb-2">
        
        <!-- [암] 원 하단: 가로 나열 텍스트 -->
        <div class="w-full flex items-center justify-center min-h-[38px] sm:min-h-[46px] text-center">
          <div id="cancerBottomContainer" class="flex flex-wrap items-center justify-center gap-x-1 sm:gap-x-1.5 text-xs sm:text-sm md:text-[17px] font-bold text-stone-700 leading-relaxed font-sans">
            <!-- JavaScript가 가로로 단어와 쉼표를 순서대로 배치 -->
          </div>
        </div>

        <!-- [2대질병] 원 하단: 가로 나열 텍스트 -->
        <div class="w-full flex items-center justify-center min-h-[38px] sm:min-h-[46px] text-center">
          <div id="twoDiseaseBottomContainer" class="flex flex-wrap items-center justify-center gap-x-1 sm:gap-x-1.5 text-xs sm:text-sm md:text-[17px] font-bold text-stone-700 leading-relaxed font-sans">
            <!-- JavaScript가 가로로 단어와 쉼표를 순서대로 배치 -->
          </div>
        </div>

      </div>

      <!-- Bottom Commentary Banner (인포그래픽 스타일) -->
      <div id="bannerBox" class="w-full bg-white/90 backdrop-blur border-2 border-orange-100 rounded-2xl px-4 py-3 flex items-center shadow-sm z-20">
        <div class="flex items-start gap-3 w-full">
          <span id="explanationDot" class="w-3 h-3 mt-1.5 shrink-0 rounded-full bg-orange-500 shadow-md animate-ping"></span>
          <div id="explanationTitle" class="font-bold text-[15px] sm:text-lg text-stone-800 leading-snug break-keep"></div>
          <div id="explanationDesc" style="display:none"></div>
        </div>
      </div>

    </main>


  </div>

  <script>
    // 5대 핵심 항목 시나리오 (오렌지/틸 테마 적용)
    const scenario5 = [
      { step: 1, type: "top", title: "암(癌) 기본 보장의 큰 원 그리기", desc: "오렌지색 원형으로 암의 기본 보장 영역을 화면 가득 크게 형성합니다.", target: "step-elem-1" },
      { step: 2, type: "top", title: "2대질병(뇌·심장) 기본 보장의 큰 원 그리기", desc: "청록색(Teal) 원형으로 2대질병 보장 영역을 화면 가득 크게 형성합니다.", target: "step-elem-2" },
      { step: 3, type: "top", title: "암의 핵심: 내부 '진단금' 원형 배치", desc: "암의 중심 기둥인 진단금 전용 점선 원을 큼직하게 배치합니다.", target: "step-elem-3" },
      { step: 4, type: "top", title: "2대질병의 핵심: 내부 '치료비' 원형 배치", desc: "2대질병의 핵심인 치료비 전용 점선 원을 큼직하게 배치합니다.", target: "step-elem-4" },
      { step: 5, type: "top", title: "암 최우선 보장: [진단금] 표시", desc: "치료 중단 및 소득 공백을 메우는 1순위 핵심입니다.", target: "step-elem-5" },
      { step: 6, type: "top", title: "2대질병 최우선 보장: [치료비] 표시", desc: "고액 수술비와 장기 치료비 보장이 1순위 핵심입니다.", target: "step-elem-6" },
      { step: 7, type: "top", title: "암의 [치료비] 항목 표시", desc: "암의 치료비 보장 구조를 표시합니다.", target: "step-elem-7" },
      { step: 8, type: "top", title: "2대질병의 [진단금] 항목 표시", desc: "2대질병의 1회성 진단비 구조를 표시합니다.", target: "step-elem-8" },
      { step: 9, type: "top", title: "2대질병의 진단금 = '위로금'", desc: "진단금 1~2천만 원은 장기 재활/간병비 앞에 위로금에 불과합니다.", target: "step-elem-9" },
      { step: 10, type: "top", title: "암의 치료비 = '빚'", desc: "진단금 없는 비급여 항암 치료비는 고스란히 가계의 '빚'이 됩니다.", target: "step-elem-10" },
      { step: 11, type: "top", title: "[결론] '2대질병' 상단 제목 강조", desc: "2대질병은 반복 치료비/수술비 중심 설계가 필수입니다.", target: "step-elem-11" },
      { step: 12, type: "top", title: "[결론] '암' 상단 제목 강조", desc: "암은 생활비와 소득을 지켜줄 진단비 최대 확보가 필수입니다.", target: "step-elem-12" },

      // 하단 2초 간격 교차 등장 (5개 줄) - highlightColor를 오렌지/틸로 변경
      { step: 13, type: "bottom", col: "cancer", text: "만성기", highlightColor: "text-orange-600", title: "[암 하단] 만성기", desc: "암은 장기적인 투병과 관리가 이어지는 만성기 질환입니다." },
      { step: 14, type: "bottom", col: "two", text: "급성기", highlightColor: "text-teal-600", title: "[2대질병 하단] 급성기", desc: "뇌·심장은 골든타임이 결정적인 초급성기 질환입니다." },

      { step: 15, type: "bottom", col: "two", text: "급여진료위주", highlightColor: "text-teal-600", title: "[2대질병 하단] 급여진료위주", desc: "응급 혈관 확장술, 스텐트 삽입 등 국민건강보험 급여 적용 진료가 중심입니다." },
      { step: 16, type: "bottom", col: "cancer", text: "선택진료위주", highlightColor: "text-orange-600", title: "[암 하단] 선택진료위주", desc: "표적/면역항암제, 로봇수술 등 비급여 선택진료 비중이 매우 높습니다." },

      { step: 17, type: "bottom", col: "cancer", text: "통원진료 92%", highlightColor: "text-orange-600", title: "[암 하단] 통원진료 92%", desc: "항암 방사선 및 약물 치료의 92%가 통원 진료로 진행됩니다." },
      { step: 18, type: "bottom", col: "two", text: "입원진료 97%", highlightColor: "text-teal-600", title: "[2대질병 하단] 입원진료 97%", desc: "중환자실 및 집중치료실 입원 진료 비율이 97%에 달합니다." },

      { step: 19, type: "bottom", col: "two", text: "입원 실손", highlightColor: "text-teal-600", title: "[2대질병 하단] 입원 실손", desc: "대부분 고액 입원 치료로 진행되어 입원 실손의료비 보장을 온전히 받습니다." },
      { step: 20, type: "bottom", col: "cancer", text: "통원 실손", highlightColor: "text-orange-600", title: "[암 하단] 통원 실손", desc: "통원 실손은 한도 한계로 수천만원 고액 비급여 치료 시 효용이 제한적입니다." },

      { step: 21, type: "bottom", col: "cancer", text: "건보제도 사각지대", highlightColor: "text-orange-600", title: "[암 하단] 건보제도 사각지대", desc: "신약 항암제나 최신 치료기법은 비급여로 건보제도의 사각지대에 놓입니다." },
      { step: 22, type: "bottom", col: "two", text: "건보제도권 포함", highlightColor: "text-teal-600", title: "[2대질병 하단] 건보제도권 포함", desc: "중증질환 산정특례 및 본인부담상한제 등 건보제도권 안에서 혜택이 매우 잘 적용됩니다." }
    ];

    // 6개 확장 모드 (병원선택가능/불가 포함)
    const scenario6 = [
      ...scenario5.slice(0, 14),
      { step: 15, type: "bottom", col: "two", text: "병원선택불가", highlightColor: "text-teal-600", title: "[2대질병 하단] 병원선택불가", desc: "응급상황으로 119 후송되며, 환자가 병원을 직접 선택할 수 없습니다." },
      { step: 16, type: "bottom", col: "cancer", text: "병원선택가능", highlightColor: "text-orange-600", title: "[암 하단] 병원선택가능", desc: "빅5 병원, 명의, 양성자 치료 등 원하는 상급 병원을 직접 선택 가능합니다." },
      { step: 17, type: "bottom", col: "cancer", text: "선택진료위주", highlightColor: "text-orange-600", title: "[암 하단] 선택진료위주", desc: "표적/면역항암제, 로봇수술 등 비급여 선택진료 비중이 매우 높습니다." },
      { step: 18, type: "bottom", col: "two", text: "급여진료위주", highlightColor: "text-teal-600", title: "[2대질병 하단] 급여진료위주", desc: "응급 혈관 확장술, 스텐트 삽입 등 국민건강보험 급여 적용 진료가 중심입니다." },
      { step: 19, type: "bottom", col: "two", text: "입원진료 97%", highlightColor: "text-teal-600", title: "[2대질병 하단] 입원진료 97%", desc: "중환자실 및 집중치료실 입원 진료 비율이 97%에 달합니다." },
      { step: 20, type: "bottom", col: "cancer", text: "통원진료 92%", highlightColor: "text-orange-600", title: "[암 하단] 통원진료 92%", desc: "항암 방사선 및 약물 치료의 92%가 통원 진료로 진행됩니다." },
      { step: 21, type: "bottom", col: "cancer", text: "통원 실손", highlightColor: "text-orange-600", title: "[암 하단] 통원 실손", desc: "통원 실손은 일 한도 한계로 비급여 고액 치료 시 효용이 제한적입니다." },
      { step: 22, type: "bottom", col: "two", text: "입원 실손", highlightColor: "text-teal-600", title: "[2대질병 하단] 입원 실손", desc: "고액 입원 치료로 진행되어 입원 실손의료비 보장을 온전히 받습니다." },
      { step: 23, type: "bottom", col: "two", text: "건보제도권 포함", highlightColor: "text-teal-600", title: "[2대질병 하단] 건보제도권 포함", desc: "중증질환 산정특례 및 본인부담상한제 등 건보제도권 안에서 혜택이 매우 잘 적용됩니다." },
      { step: 24, type: "bottom", col: "cancer", text: "건보제도 사각지대", highlightColor: "text-orange-600", title: "[암 하단] 건보제도 사각지대", desc: "비급여 항암제 등은 건보제도의 사각지대에 놓입니다." }
    ];

    /* ── 등장 순서(프레임) ──
       한 프레임 = 한 번에 나오는 단계 묶음. 1→2단계만 0.3초 간격으로 저절로 나오고, 이후는 클릭할 때마다 한 프레임씩 */
    const AUTO_GAP_MS = 300;   // 1단계 → 2단계만 자동(0.3초). 나머지는 클릭으로 넘긴다
    const AUTO_FRAMES = 2;
    const TOP_FRAMES = [
      { steps: [1] }, { steps: [2] },
      { steps: [7] },
      { steps: [3, 5], title: "암의 핵심: '진단금' 원형 배치와 [진단금] 표시", desc: "치료 중단 및 소득 공백을 메우는 1순위 핵심입니다." },
      { steps: [10] }, { steps: [8] },
      { steps: [4, 6], title: "2대질병의 핵심: '치료비' 원형 배치와 [치료비] 표시", desc: "고액 수술비와 장기 치료비 보장이 1순위 핵심입니다." },
      { steps: [9] },
      { steps: [11], then: [12], lag: 300, title: "[결론] '2대질병'과 '암' 상단 제목 강조",
        desc: "2대질병은 반복 치료비/수술비 중심, 암은 생활비와 소득을 지켜줄 진단비 최대 확보가 필수입니다." }
    ];
    /* 배너에 나오는 설명 (핵심 모드 1~19단계). 확장 모드는 1~9단계만 같은 문구를 쓴다 */
    const BANNER_TEXTS = [
      "보험료를 낼 수 있는 여력이 넉넉 하다면 문제 없겠지만 선택과 집중을 해야 되겠지요.",
      "3대 질병의 양상을 이해하고 국가제도나 보험의 영역에서 어떻게 보상이 되고 어떤 사각지대가 있는지 확인 하겠습니다",
      "커다란 원 만큼의 치료비가 나왔는데...",
      "진단금의 크기가 이정도라면~",
      "나머지의 영역은 고스란히 가계의 '빚'이 됩니다.",
      "다른쪽은 진단금을 이만큼 받았어요.",
      "그런데 치료비가 요만큼만 나오게 된다면",
      "나머지는 위로금이 됩니다.",
      "왼쪽은 암 발병시 보험과 병원비의 양상이고, 오른쪽은 2대질병의 양상입니다. 이유를 살펴보면",
      "암은 장기적인 투병과 관리가 이어지는 만성기 질환으로 병원 선택이 가능합니다.",
      "하지만 2대질병은 급성기 골든타임이 결정적인 질환으로 병원 선택이 불가능 합니다.",
      "2대질병은 치료기법이 표준화 되어있는 급여 적용 진료 중심입니다.",
      "하지만 암은 표적/면역항암제, 로봇수술 등 비급여 선택진료 비중이 매우 높습니다.",
      "게다가 암은 항암 방사선 및 약물 치료등 92%가 통원 진료로 진행됩니다.",
      "2대질병 수술위주의 중환자실 및 집중치료실 입원 진료 비율이 97%에 달합니다.",
      "2대질병은 대부분 입원 치료로 진행되어 입원 실손의료비 보장을 온전히 받습니다.",
      "암은 통원중심이다 보니 2,30만원의 통원 실손의 한도 한계로 수천만원 고액 비급여 치료 시 도움받기 어렵습니다.",
      "암의 최신 치료기법은 전액본인부담,비급여등으로 산정특례, 본인부담상한제 사각지대에 놓입니다.",
      "2대질병은 표준치료기법으로 중증질환 산정특례 및 본인부담상한제 등 건보제도권 안에서 혜택이 매우 잘 적용됩니다."
    ];
    let isSixMode = false;
    let presentationSteps = scenario5;
    let frames = [];
    let currentStepIndex = 1;          // 현재 프레임 번호(1부터)
    let isAutoPlaying = false;
    let playTimerId = null;
    let isViewAllMode = false;

    function buildFrames() {
      const byStep = {};
      presentationSteps.forEach(s => { byStep[s.step] = s; });
      const mk = (f, fast) => {
        const first = byStep[f.steps[0]];
        return { steps: f.steps, then: f.then || [], lag: f.lag || 0, fast: fast, title: f.title || first.title, desc: f.desc || first.desc,
                 type: first.type, col: first.col };
      };
      frames = TOP_FRAMES.map(f => mk(f, true));
      presentationSteps.filter(s => s.type === "bottom").forEach(s => frames.push(mk({ steps: [s.step] }, false)));
      frames.forEach((f, i) => { f.text = (i < BANNER_TEXTS.length && (!isSixMode || i < 9)) ? BANNER_TEXTS[i] : f.desc; });
      if (window.fitBanner) fitBanner();
    }

    /* 가장 긴 문구에 맞춰 설명 상자 높이를 정해 두면, 글이 잘리지 않고 단계가 바뀌어도 그림이 흔들리지 않는다 */
    function fitBanner() {
      const box = document.getElementById('bannerBox');
      if (!box || !frames.length) return;
      box.style.minHeight = '';
      const keep = explanationTitleEl.textContent;
      let max = 0;
      frames.forEach(f => { explanationTitleEl.textContent = f.text; max = Math.max(max, box.offsetHeight); });
      explanationTitleEl.textContent = keep;
      box.style.minHeight = max + 'px';
    }
    let fitTimer = null;
    window.addEventListener('resize', () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitBanner, 120); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => fitBanner());
    let stageOn = true, stageTimer = null;   // 한 프레임 안에서 뒤쪽 요소(then)를 lag 뒤에 보여주는 상태
    function shownSet(upTo) {
      const set = new Set();
      for (let k = 0; k < upTo; k++) {
        frames[k].steps.forEach(x => set.add(x));
        if (k < upTo - 1 || stageOn) frames[k].then.forEach(x => set.add(x));
      }
      return set;
    }

    // DOM 참조
    const stepCounterEl = document.getElementById('stepCounterNumber');
    const totalStepEl = document.getElementById('totalStepNumber');
    const explanationTitleEl = document.getElementById('explanationTitle');
    const explanationDescEl = document.getElementById('explanationDesc');
    const explanationDotEl = document.getElementById('explanationDot');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const cancerBottomContainer = document.getElementById('cancerBottomContainer');
    const twoDiseaseBottomContainer = document.getElementById('twoDiseaseBottomContainer');
    const modeToggleBtn = document.getElementById('modeToggleBtn');
    const modeToggleText = document.getElementById('modeToggleText');

    // 하단 텍스트 요소들 DOM 생성
    function buildBottomTextDOM() {
      cancerBottomContainer.innerHTML = '';
      twoDiseaseBottomContainer.innerHTML = '';
      [["cancer", cancerBottomContainer], ["two", twoDiseaseBottomContainer]].forEach(([col, box]) => {
        const items = presentationSteps.filter(s => s.type === "bottom" && s.col === col);
        items.forEach((item, idx) => {
          const span = document.createElement('span');
          span.id = `bottom-step-${item.step}`;
          span.className = `step-obj step-hidden transition-all duration-300 font-extrabold ${item.highlightColor}`;
          span.textContent = item.text;
          box.appendChild(span);
          if (idx < items.length - 1) {
            const comma = document.createElement('span');
            comma.id = `bottom-comma-${item.step}`;
            comma.className = 'step-obj step-hidden text-stone-400 font-bold';
            comma.textContent = ',';
            box.appendChild(comma);
          }
        });
      });
    }

    function renderStepPills() { totalStepEl.textContent = `/ ${frames.length}`; }

    function setShown(el, on) {
      if (!el) return;
      el.classList.toggle('step-hidden', !on);
      el.classList.toggle('step-visible', on);
    }

    function updateVisualStates() {
      stepCounterEl.textContent = currentStepIndex;
      const cur = frames[currentStepIndex - 1];
      const shown = shownSet(currentStepIndex);
      const curSteps = (isViewAllMode ? [] : cur.steps.concat(stageOn ? cur.then : []));

      explanationTitleEl.textContent = cur.text;
      explanationDotEl.className = isViewAllMode ? "w-3 h-3 mt-1.5 shrink-0 rounded-full bg-teal-500 shadow-md"
        : (cur.type === "bottom" && cur.col === "two"
            ? "w-3 h-3 mt-1.5 shrink-0 rounded-full bg-teal-500 shadow-md animate-ping"
            : "w-3 h-3 mt-1.5 shrink-0 rounded-full bg-orange-500 shadow-md animate-ping");

      // 상단 다이어그램 요소들 (Step 1 ~ 12)
      for (let s = 1; s <= 12; s++) {
        const el = document.getElementById(`step-elem-${s}`);
        if (!el) continue;
        setShown(el, isViewAllMode || shown.has(s));
        el.classList.toggle('active-highlight', curSteps.includes(s));
      }
      // 하단 텍스트 항목들
      presentationSteps.filter(s => s.type === "bottom").forEach(s => {
        const on = isViewAllMode || shown.has(s.step);
        const textEl = document.getElementById(`bottom-step-${s.step}`);
        setShown(textEl, on);
        if (textEl) textEl.classList.toggle('word-active', curSteps.includes(s.step));
        setShown(document.getElementById(`bottom-comma-${s.step}`), on);
      });
      prevBtn.disabled = currentStepIndex <= 1;
      nextBtn.disabled = currentStepIndex >= frames.length;
    }

    function goToStep(n) {
      currentStepIndex = Math.max(1, Math.min(frames.length, n));
      isViewAllMode = false;
      if (stageTimer) clearTimeout(stageTimer);
      const f = frames[currentStepIndex - 1];
      stageOn = !f.then.length;
      updateVisualStates();
      if (!stageOn) stageTimer = setTimeout(() => { stageOn = true; updateVisualStates(); }, f.lag);
    }
    function nextStep() { if (currentStepIndex < frames.length) goToStep(currentStepIndex + 1); }
    function prevStep() { if (currentStepIndex > 1) goToStep(currentStepIndex - 1); }

    /* 자동 진행은 1→2단계(0.3초)뿐. 그 뒤로는 '다음' 버튼이나 화면 클릭으로 넘긴다 */
    function scheduleNext() {
      if (!isAutoPlaying) return;
      if (currentStepIndex >= AUTO_FRAMES) { isAutoPlaying = false; return; }
      playTimerId = setTimeout(() => { nextStep(); scheduleNext(); }, AUTO_GAP_MS);
    }
    function startPlay(fromStart) {
      stopPlay();
      isViewAllMode = false;
      if (fromStart) goToStep(1);
      isAutoPlaying = true;
      scheduleNext();
    }
    function stopPlay() {
      isAutoPlaying = false;
      if (playTimerId) clearTimeout(playTimerId);
      playTimerId = null;
    }
    /* 화면(그림판)을 눌러도 다음 단계로 */
    function advanceByClick() { if (isViewAllMode) return; stopPlay(); nextStep(); }

    // 모드 전환
    modeToggleBtn.addEventListener('click', () => {
      stopPlay();
      isSixMode = !isSixMode;
      presentationSteps = isSixMode ? scenario6 : scenario5;
      modeToggleText.textContent = isSixMode ? "6개 확장 모드 (병원선택)" : "5개 핵심 모드";
      isViewAllMode = false;
      buildFrames(); buildBottomTextDOM(); renderStepPills();
      startPlay(true);
    });

    // 버튼 이벤트
    nextBtn.addEventListener('click', (e) => { e.stopPropagation(); stopPlay(); nextStep(); });
    prevBtn.addEventListener('click', (e) => { e.stopPropagation(); stopPlay(); prevStep(); });

    // 키보드 조작 (← →)
    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowRight') { e.preventDefault(); stopPlay(); nextStep(); }
      else if (e.code === 'ArrowLeft') { e.preventDefault(); stopPlay(); prevStep(); }
    });

    // 초기화 — 열리면 바로 자동 시작
    window.onload = function() {
      buildFrames(); buildBottomTextDOM(); renderStepPills();
      currentStepIndex = 1; updateVisualStates();
      startPlay(false);
      const board = document.querySelector('main');
      board.style.cursor = 'pointer';
      board.addEventListener('click', advanceByClick);
    };
  </script>
</body>
</html>
